name: 출결선생 로그인 시험

# 출결선생(admin.checkbus.co.kr) 관리자 로그인이 자동으로 되는지, 어떤 내부 주소를 쓰는지 관찰한다 (1단계 정찰).
# 수동 실행 전용 (Actions 탭 → 이 워크플로 → Run workflow).
# 필요한 비밀값: CHECKBUS_ID, CHECKBUS_PASSWORD  (Settings → Secrets and variables → Actions)
# 로그에는 비밀번호·토큰·쿠키 값을 찍지 않고, 학생 이름·전화번호는 가린다 (이 저장소와 로그는 공개).

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright 설치
        run: |
          npm install --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: 로그인 시험
        env:
          CHECKBUS_ID: ${{ secrets.CHECKBUS_ID }}
          CHECKBUS_PASSWORD: ${{ secrets.CHECKBUS_PASSWORD }}
        run: node sync/checkbus_login_test.js
