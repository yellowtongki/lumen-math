name: 학교 학사일정 수집

# 우리 학생들이 다니는 학교(옥길중·범박중·범박고·소사고 …)의 시험일을
# 교육부 나이스(NEIS)에서 매일 받아와 Supabase에 저장한다.
# 시험 날짜는 자주 바뀌지 않으므로 하루 한 번이면 충분하다.
#
# 필요한 비밀값 (Repo Settings → Secrets and variables → Actions):
#   NEIS_KEY, SUPABASE_URL, SUPABASE_SERVICE_KEY

on:
  schedule:
    - cron: '30 18 * * *'    # UTC 18:30 = 한국시간 03:30 (매쓰플랫 수집 30분 전)
  workflow_dispatch:

concurrency:
  group: school-info
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 학사일정 수집
        env:
          NEIS_KEY: ${{ secrets.NEIS_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node sync/school_info.js
