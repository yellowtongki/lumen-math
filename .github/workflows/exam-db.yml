name: 기출 DB 수집 (수학비서 + 매쓰플랫 다리)

# 우리 학원이 다루는 학교(옥길중·범박중·범박고·소사고 — 2026-09-23 원장 지시로 네 곳 모두)의 기출 시험지를
# 수학비서 「나만의 DB」에서 문항 단위로 받아(단원·유형·난이도·배점·서술형·이미지)
# Supabase(lumen_store ms_exams_<학교> · Storage exam_images)에 넣고,
# 매쓰플랫이 같은 기출을 원본 학습지로 인식해 둔 것에서 문항별 유형 번호·그림을 잇는다(ms_exam_bridge).
#
# ⚠️ 매쓰플랫은 동시 로그인 시 원장님 접속이 끊긴다 → 새벽에만 돈다 (일요일 03:30 KST).
#    낮에 손으로 돌릴 때는 mode=collect(수학비서만)로.
#
# 필요한 비밀값: MATHSECR_ID, MATHSECR_PASSWORD, MATHFLAT_ID, MATHFLAT_PASSWORD, SUPABASE_URL, SUPABASE_SERVICE_KEY

on:
  schedule:
    - cron: '30 18 * * 6'    # UTC 토 18:30 = 한국시간 일요일 03:30
  workflow_dispatch:
    inputs:
      schools:
        description: '학교 (쉼표로 여러 개, 수학비서 폴더 이름 그대로)'
        required: true
        default: '옥길중,범박중,범박고,소사고'
      mode:
        description: 'collect = 수학비서만 (낮에도 OK) · bridge = 수학비서 + 매쓰플랫 다리 (새벽만) · bridge-only'
        required: true
        default: 'collect'
        type: choice
        options: [collect, bridge, bridge-only]

concurrency:
  group: exam-db
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 기출 DB 수집
        env:
          MATHSECR_ID: ${{ secrets.MATHSECR_ID }}
          MATHSECR_PASSWORD: ${{ secrets.MATHSECR_PASSWORD }}
          MATHFLAT_ID: ${{ secrets.MATHFLAT_ID }}
          MATHFLAT_PASSWORD: ${{ secrets.MATHFLAT_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SCHOOLS: ${{ github.event.inputs.schools || '옥길중,범박중,범박고,소사고' }}
          MODE: ${{ github.event.inputs.mode || 'bridge' }}
        run: |
          ARGS="--schools $SCHOOLS"
          if [ "$MODE" = "bridge" ]; then ARGS="$ARGS --bridge"; fi
          if [ "$MODE" = "bridge-only" ]; then ARGS="$ARGS --bridge-only"; fi
          node sync/exam_db_collector.js $ARGS
