name: 매쓰플랫 자동수집 (하루 3번)

# 매쓰플랫 정오답을 수집해 Supabase에 저장한다. 진도 레이스 점수의 원재료다.
# - 컴퓨터를 켜둘 필요 없음(GitHub 서버에서 실행).
# - 필요한 비밀값(Repo Settings → Secrets and variables → Actions):
#     MATHFLAT_ID, MATHFLAT_PASSWORD, SUPABASE_URL, SUPABASE_SERVICE_KEY
# - 수동 실행: Actions 탭 → 이 워크플로 → "Run workflow" (기간 일수 지정 가능)
#
# 【2026-08-28 하루 1번 → 3번으로 (원장님 지시)】
#   [왜] 새벽 4시 한 번만 돌아서, 그날 낮에 푼 문제가 다음 날 새벽에야 점수에
#     들어갔다. 실측: 오후 6시 22분인데 서버의 가장 최근 채점 기록이 그날 00시 02분.
#     진도 레이스 순위를 아무리 자주 다시 세도 원재료가 어제 것이라 소용이 없었다.
#   [언제] 새벽 4시(어제 마무리) · 오후 4시(오전·낮반 반영) · 밤 10시(수업 끝난 뒤)
#     — 셋 다 원장님이 매쓰플랫을 안 쓰실 시간대다(동시 로그인하면 접속이 끊긴다).
#   [겹침 걱정 없음] concurrency 그룹이 같아서 앞 수집이 돌고 있으면 기다린다.
#     매번 최근 7일치를 다시 훑으므로 한 번 걸러도 다음 번에 메워진다.

on:
  schedule:
    - cron: '0 19 * * *'    # UTC 19:00 = 한국 04:00 새벽 — 어제치 마무리
    - cron: '0 7 * * *'     # UTC 07:00 = 한국 16:00 오후 — 오전·낮반 반영
    - cron: '0 13 * * *'    # UTC 13:00 = 한국 22:00 밤   — 그날 수업까지 반영
  workflow_dispatch:
    inputs:
      days:
        description: '수집 기간(최근 N일). 첫 실행은 크게(예: 60), 이후엔 7 권장'
        required: false
        default: '7'

concurrency:
  group: mathflat-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 매쓰플랫 수집 실행
        env:
          MATHFLAT_ID: ${{ secrets.MATHFLAT_ID }}
          MATHFLAT_PASSWORD: ${{ secrets.MATHFLAT_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          node sync/mathflat_collector.js --days ${{ github.event.inputs.days || '7' }}
          node sync/mockexam_engine.js || echo "기출모의 엔진 실패 (수집은 정상)"
          # 시험대비 트랙에 새로 담긴 교재의 「쪽별 문항 수」를 매쓰플랫에서 받아
          # 목표 문항 수를 정확한 값으로 채운다. 이미 받아 둔 교재는 그냥 건너뛰므로
          # 평소에는 몇 초면 끝난다(로그인조차 하지 않는다).
          node sync/mf_book_toc.js --track --apply || echo "교재 목차 수집 실패 (수집은 정상)" 
