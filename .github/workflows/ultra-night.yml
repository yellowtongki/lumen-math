name: 울트라 초안 · 녹음 주제 새벽 작성 (고정 스크립트)

# 매일 새벽 4시 Routine(Claude 세션)이 9/30부터 자동 안전 검사에 막혀 초안·녹음 주제를
# 남기지 못했다(원장 결정 2026-10-02 「B로 진행」). 그 일을 «판단 없는» 고정 스크립트로 옮겼다.
#   ① 울트라 초안 — 최근 7일 중 학습지를 풀었는데 초안이 없는 (날짜, 학생)만 채운다 → ultra_drafts
#   ② 녹음 주제 — 오늘 수업하는 반의 학년·학생 주제 → rec_topics
# 매쓰플랫 수집(04:00)·플래너 채점(04:25) 뒤에 돈다. 로그에는 날짜·인원수만 남는다(이름·글 없음).
#
# 필요한 비밀값: SUPABASE_URL, SUPABASE_SERVICE_KEY, ANTHROPIC_API_KEY

on:
  schedule:
    - cron: '50 19 * * *'   # UTC 19:50 = 한국시간 04:50
  workflow_dispatch:
    inputs:
      days:
        description: '최근 며칠까지 빈 초안을 채울지 (기본 7)'
        required: false
        default: '7'
      max:
        description: '한 번에 최대 초안 수 (기본 60)'
        required: false
        default: '60'
      only:
        description: 'drafts(초안만) / topics(녹음 주제만) / 비우면 둘 다'
        required: false
        default: ''
      dry:
        description: 'true 면 쓰지 않고 대상 목록만'
        required: false
        default: 'false'

concurrency:
  group: ultra-night
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 초안 · 녹음 주제 작성
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node sync/ultra_night_writer.js --days "${{ github.event.inputs.days || '7' }}" --max "${{ github.event.inputs.max || '60' }}" ${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }} ${{ github.event.inputs.dry == 'true' && '--dry' || '' }}
