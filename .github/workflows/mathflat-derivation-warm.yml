name: 쌍둥이 미리 받기 (새벽)

# 2026-11-06 원장 지시 「새벽받기도 하고」 — docs/mathflat_derivation_cache.md
#
# 리커버리 학습지를 만들 때 매쓰플랫 쌍둥이 조회(/derivation/problem)를 한 번에 770회 부르다가
# 보안문자(CAPTCHA_REQUIRED)에 막혔다(11/6, 원장 PC·클라우드 두 곳 모두).
# 3초 간격이면 막히지 않지만 16명에 35분이 걸린다.
# → 어제 새로 생긴 오답 문항의 쌍둥이만 매일 새벽 미리 받아 두면,
#   리커버리를 만들 때는 캐시에서 꺼내 쓰므로 거의 즉시 끝난다.
#
# 먼저 할 것: docs/mf_derivation_cache.sql 로 표를 만든다 (새벽에).
#   표가 없으면 이 작업은 「표가 없습니다」만 남기고 빨간불로 끝난다.
#
# 매쓰플랫 수집(04:00)·플래너 채점(04:25)·울트라(04:50) 뒤에 돌도록 05:10 에 둔다.
# 같은 줄(concurrency)에 묶어 다른 매쓰플랫 작업과 동시에 때리지 않게 한다 —
# 보안문자는 계정 단위 속도 제한이라 동시에 돌면 합산된다.

on:
  schedule:
    - cron: '10 20 * * *'    # UTC 20:10 = 한국시간 05:10
  workflow_dispatch:
    inputs:
      days:
        description: '최근 며칠 오답까지 (기본 35)'
        required: false
      max:
        description: '한 번에 받을 최대 문항 수 (기본 500)'
        required: false
      gap:
        description: '쌍둥이 조회 사이 쉬는 시간 ms (기본 3000)'
        required: false

concurrency:
  group: mathflat-ondemand
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 쌍둥이 미리 받기
        env:
          MATHFLAT_ID: ${{ secrets.MATHFLAT_ID }}
          MATHFLAT_PASSWORD: ${{ secrets.MATHFLAT_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          node sync/mf_derivation_warm.js \
            --days "${{ github.event.inputs.days || '35' }}" \
            --max  "${{ github.event.inputs.max  || '500' }}" \
            --gap  "${{ github.event.inputs.gap  || '3000' }}"
