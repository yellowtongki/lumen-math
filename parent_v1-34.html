<!DOCTYPE html>
<html lang="ko">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:#eef2f8;color:#0f172a;min-height:100vh}
button{font-family:inherit;cursor:pointer}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:#eef2f8}
/* 로그인 */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;background:linear-gradient(160deg,#0d2240,#1d3a6e)}
.login .lg{font-size:13px;font-weight:800;color:#ffd54a;letter-spacing:2px}
.login h1{color:#fff;font-size:26px;font-weight:900;margin-top:8px}
.login p{color:#8fb8e8;font-size:13px;font-weight:600;margin-top:6px;text-align:center;line-height:1.7}
.login input{margin-top:22px;width:100%;max-width:280px;border:none;border-radius:14px;padding:16px;font-size:20px;font-weight:900;text-align:center;letter-spacing:4px;font-family:inherit;outline:none;text-transform:uppercase}
.login button{margin-top:12px;width:100%;max-width:280px;border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:900;background:#ffd54a;color:#0d2240}
.login .err{color:#fca5a5;font-size:12px;font-weight:700;margin-top:12px;min-height:18px;text-align:center;white-space:pre-line}
.login .ft{color:#3f5578;font-size:10px;font-weight:700;margin-top:30px}
/* 헤더 */
.hd{background:linear-gradient(160deg,#0d2240 0%,#16305c 70%,#1d3a6e 100%);padding:20px 20px 46px;color:#fff;position:relative;overflow:hidden}
.hd::after{content:'';position:absolute;top:-40px;right:-30px;width:150px;height:150px;border-radius:50%;background:rgba(255,213,74,.07)}
.hd .brand{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;color:#ffd54a;letter-spacing:1.5px}
.hd .brand .out{margin-left:auto;background:rgba(255,255,255,.12);border:none;color:#c7d5ee;font-size:9.5px;font-weight:800;border-radius:50px;padding:4px 10px}
.hd .name{font-size:23px;font-weight:900;margin-top:6px;letter-spacing:-.4px}
.hd .name small{font-size:11px;font-weight:700;color:#8fb8e8;margin-left:5px}
.hd .greet{font-size:11px;color:#c7d5ee;font-weight:600;margin-top:3px}
.sibs{display:flex;gap:6px;margin-top:10px;position:relative;z-index:2}
.sib{border:none;font-size:10.5px;font-weight:800;border-radius:50px;padding:5px 13px;background:rgba(255,255,255,.13);color:#c7d5ee}
.sib.on{background:#ffd54a;color:#0d2240}
/* 상태 캡슐 */
.caps{display:flex;gap:9px;padding:0 16px;margin-top:-28px;position:relative;z-index:2}
/* ═══ v1-19 홈 개편 ═══ */
.hero.top,.sec.top{margin-top:-28px;position:relative;z-index:2}   /* 리포트가 헤더에 살짝 걸치게 */
.caps.after{margin-top:12px}                                       /* 히어로 밑에 올 때는 겹치지 않게 */
/* 홈 ③ 성적 한 줄 */
.strip{margin:12px 16px 0;background:#fff;border-radius:17px;padding:13px 15px;box-shadow:0 3px 12px rgba(13,34,64,.05);cursor:pointer;border:1.5px solid #eef2f7}
.strip:active{transform:scale(.99)}
.strip .sth{font-size:13.5px;font-weight:900;color:#0d2240;display:flex;align-items:center}
.strip .go{margin-left:auto;font-size:12px;font-weight:800;color:#1d6fe8}
.strip .stv{display:flex;gap:8px;margin-top:10px}
.strip .stb{flex:1;background:#f8fafc;border-radius:12px;padding:8px 6px;text-align:center;min-width:0}
.strip .stb .l{font-size:9.5px;font-weight:800;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .stb .v{font-size:15px;font-weight:900;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 홈 ④ 로드맵 한 줄 */
.rstrip{margin:12px 16px 14px;background:linear-gradient(135deg,#0d2240,#16305c);color:#fff;border-radius:17px;padding:14px 15px;box-shadow:0 6px 18px rgba(13,34,64,.14);cursor:pointer}
.rstrip:active{transform:scale(.99)}
.rstrip .rsh{font-size:13.5px;font-weight:900;display:flex;align-items:center}
.rstrip .go{margin-left:auto;font-size:12px;font-weight:800;color:#ffd54a}
.rstrip .rsn{font-size:12px;font-weight:900;margin-top:10px}
.rstrip .rsn small{font-size:9.5px;color:#6ee7b7;font-weight:800}
.rstrip .rsbar{height:9px;background:rgba(255,255,255,.12);border-radius:99px;margin-top:7px;overflow:hidden}
.rstrip .rsbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd54a,#f59e0b);border-radius:99px}
.rstrip .rsp{font-size:9px;color:#8fb8e8;font-weight:700;margin-top:4px}
/* 성적 탭 — 참고용 안내 */
.refnote{margin:12px 16px 20px;background:#f8fafc;border:1.5px solid #e8eef8;border-radius:14px;padding:12px 14px;font-size:11.5px;font-weight:700;color:#475569;line-height:1.85}
.refnote b{color:#0d2240}
/* 성적 탭 — KMM 경시대회 */
.kmc{margin:12px 16px 0;background:#fff;border:2px solid #fde68a;border-radius:18px;padding:15px;box-shadow:0 6px 18px rgba(13,34,64,.08)}
.kmc .kmh{display:flex;align-items:center;gap:8px}
.kmc .kmh b{font-size:14px;color:#0d2240}
.kmc .kmh small{font-size:10px;color:#94a3b8;font-weight:700}
.kmc .kmbest{border-radius:14px;padding:11px 13px;margin-top:11px;display:flex;align-items:center;gap:10px}
.kmc .kmbest .bl{font-size:10px;font-weight:800;color:#94a3b8}
.kmc .kmbest .bv{font-size:17px;font-weight:900;margin-left:auto}
.kmc .kmbest .bd{font-size:10px;font-weight:800;color:#94a3b8}
.kmc .kmlist{margin-top:11px;display:flex;flex-direction:column;gap:5px}
.kmc .kmr{display:flex;align-items:center;gap:7px;background:#f8fafc;border-radius:10px;padding:7px 10px}
.kmc .kmr .d{font-size:11px;font-weight:900;color:#0d2240;width:52px;flex-shrink:0}
.kmc .kmr .g{font-size:10px;font-weight:800;color:#94a3b8;width:34px;flex-shrink:0}
.kmc .kmr .s{font-size:11.5px;font-weight:900;color:#1d6fe8;flex:1;text-align:right}
.kmc .kmr .t{font-size:10.5px;font-weight:900;border-radius:50px;padding:3px 9px;flex-shrink:0;white-space:nowrap}
.kmc .kmfoot{font-size:10px;color:#94a3b8;font-weight:700;line-height:1.7;margin-top:10px;border-top:1px dashed #e8eef8;padding-top:9px}
.cap{flex:1;background:#fff;border-radius:15px;padding:11px 13px;display:flex;align-items:center;gap:9px;box-shadow:0 6px 18px rgba(13,34,64,.10)}
.cap .ci{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.cap .ct{font-size:10px;font-weight:800;color:#64748b}
.cap .cs{font-size:12px;font-weight:900;margin-top:1px}
/* 히어로 */
.hero{margin:14px 16px 0;border-radius:20px;overflow:hidden;box-shadow:0 10px 26px rgba(13,34,64,.14);background:#fff}
.hero-top{padding:16px 17px 14px;color:#fff;position:relative;overflow:hidden}
.hero-top::after{content:'';position:absolute;top:-30px;right:-20px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero-top .or{font-size:8.5px;opacity:.75;letter-spacing:1.6px;font-weight:800}
.hero-top .nm{font-size:20px;font-weight:900;margin-top:3px}
.hero-top .tags{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.hero-top .tg{font-size:9px;font-weight:800;background:rgba(255,255,255,.16);border-radius:7px;padding:3px 9px}
.hero-top .tg.gold{background:#ffd54a;color:#7f1d1d}
.hero-bd{padding:14px 16px}
.ring{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ring>div{width:50px;height:50px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:17px;color:#0d2240}
.ring span{font-size:7.5px;font-weight:800;color:#94a3b8}
.tot{background:#0d2240;border-radius:13px;padding:12px 14px;margin-top:12px}
.tot .t1{font-size:10px;font-weight:900;color:#ffd54a}
.tot .t2{font-size:11.5px;color:#e2e8f0;line-height:1.7;margin-top:5px;white-space:pre-wrap}
.tot .t2.clip{overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.hero-cta{display:flex;gap:8px;margin-top:12px}
.hero-cta .b1{flex:1;border:none;background:linear-gradient(135deg,#1d6fe8,#3b82f6);color:#fff;font-size:12.5px;font-weight:900;padding:12px 0;border-radius:12px;box-shadow:0 4px 12px rgba(29,111,232,.3)}
/* v1-6: 우리 아이 등수 카드 */
.rkc{margin:12px 16px 0;background:#fff;border:2px solid #bfdbfe;border-radius:18px;padding:15px;position:relative;box-shadow:0 6px 18px rgba(13,34,64,.08)}
.amc{margin:12px 16px 0;background:#fff;border:1.5px solid #e2e8f0;border-radius:18px;padding:15px;box-shadow:0 4px 14px rgba(13,34,64,.06)}
.rkc .t{font-size:14px;font-weight:900;color:#0d2240}
.rkc .sub{font-size:10px;color:#94a3b8;font-weight:700;margin:2px 0 11px}
.rk3{display:flex;gap:8px}
.rkb{flex:1;border-radius:13px;padding:11px 5px;text-align:center}
.rkb .l{font-size:10px;font-weight:800}
.rkb .v{font-size:20px;font-weight:900;margin-top:2px}
.rkb .v small{font-size:10px;font-weight:800;opacity:.6}
.rkb .d{font-size:9.5px;font-weight:900;margin-top:3px}
.rkb.s{background:#f8fafc;color:#334155}.rkb.s .v{color:#0d2240}
.rkb.a{background:#ecfdf5;color:#065f46}.rkb.a .v{color:#059669}
.rkb.n{background:#eff6ff;color:#1e40af}.rkb.n .v{color:#1d6fe8}
.rkg{margin-top:12px}
.rkg .gl{display:flex;justify-content:space-between;font-size:9px;font-weight:800;color:#94a3b8;margin-bottom:5px}
.rkbar{height:13px;border-radius:50px;background:linear-gradient(90deg,#059669,#84cc16 35%,#f59e0b 65%,#f87171);position:relative;margin-bottom:24px}
.rkdot{position:absolute;top:-5px;transform:translateX(-50%);text-align:center}
.rkdot .pin{width:23px;height:23px;border-radius:50%;background:#fff;border:3.5px solid #0d2240;margin:0 auto}
.rkdot .pt{font-size:9.5px;font-weight:900;color:#0d2240;background:#fff;border-radius:50px;padding:1px 8px;box-shadow:0 2px 6px rgba(13,34,64,.2);margin-top:2px;white-space:nowrap}
.rktr{margin-top:2px;background:#f8fafc;border-radius:13px;padding:11px 12px}
.rktr .tt{font-size:11px;font-weight:900;color:#0d2240;margin-bottom:8px}
.rkbars{display:flex;gap:10px;align-items:flex-end;height:70px;padding:0 4px}
.rkcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.rkcol .bv{font-size:9.5px;font-weight:900;color:#64748b;margin-bottom:3px}
.rkcol .bar{width:24px;border-radius:7px 7px 3px 3px;background:#cbd5e1}
.rkcol.hot .bar{background:linear-gradient(180deg,#1d6fe8,#60a5fa)}
.rkcol.hot .bv{color:#1d6fe8}
.rkcol .bd{font-size:8.5px;font-weight:800;color:#94a3b8;margin-top:4px}
.rkfoot{font-size:9px;color:#94a3b8;font-weight:700;text-align:center;margin-top:10px;line-height:1.6}
/* 지난 리포트 스트립 */
.hist{display:flex;gap:7px;padding:12px 16px 2px;overflow-x:auto}
.hp{flex-shrink:0;background:#fff;border:1.5px solid #e8eef8;border-radius:13px;padding:8px 12px;text-align:center;min-width:56px}
.hp.on{border-color:#1d6fe8;background:#eff6ff}
.hp .d{font-size:9px;font-weight:800;color:#94a3b8}
.hp .s{font-size:13px;font-weight:900;color:#0d2240;margin-top:1px}
.hp .g{width:7px;height:7px;border-radius:50%;margin:3px auto 0}
/* 섹션 */
.sec{margin:12px 16px 0;background:#fff;border-radius:17px;padding:14px 15px;box-shadow:0 3px 12px rgba(13,34,64,.05)}
.sec .st{font-size:13px;font-weight:900;color:#0d2240;display:flex;align-items:center;gap:7px}
.sec .st .more{margin-left:auto;font-size:10px;color:#1d6fe8;font-weight:800;background:none;border:none}
.wk{display:flex;gap:5px;margin-top:10px}
.wk>div{flex:1;text-align:center}
.wk .wd{font-size:8.5px;color:#94a3b8;font-weight:700}
.wk .wv{height:32px;border-radius:9px;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;margin-top:3px}
.subnote{font-size:10.5px;color:#64748b;font-weight:600;margin-top:8px}
/* 하단 탭 */
/* ══ v1-24: 🏁 진도 레이스 ══ */
/* v1-28: 다른 홈 카드(.sec)와 같은 여백·모서리·그림자를 쓴다.
   예전엔 좌우 여백이 0이라 이 카드만 화면 끝까지 붙어 비율이 어긋나 보였다.
   안쪽 여백은 각 부분이 직접 갖는다 — 머리를 카드 끝까지 채우려고
   음수 여백을 쓰던 방식은 깨지기 쉬워 그만뒀다. */
.rcp{background:#fff;border:1.5px solid #eef2f7;border-radius:17px;margin:12px 16px 0;box-shadow:0 3px 12px rgba(13,34,64,.05);overflow:hidden}
/* 맨 위에 올 때는 남색 머리에 살짝 걸치게 (원래 첫 카드가 하던 것) */
.rcp.top{margin-top:-28px;position:relative;z-index:2}
/* v1-26: 트로피 골드 머리 + 접기. 예전 이름(.hd)은 학부모앱에 이미 있던 남색 헤더와
   충돌해 남색 위 남색 글씨가 됐다 — 이름을 .rhd로 바꿔 해결. */
.rcp .rhd{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;background:linear-gradient(135deg,#f9a825,#ef6c00);padding:13px 15px}
.rcp .rhd .t{font-size:15px;font-weight:900;color:#2b1600}
.rcp .rhd .d{font-size:10.5px;font-weight:900;color:#ffd9a8;background:#7a2e00;border-radius:50px;padding:2px 8px}
.rcp .rhd .ch{margin-left:auto;font-size:15px;color:rgba(43,22,0,.6);transition:transform .18s}
.rcp.open .rhd .ch{transform:rotate(180deg)}
.rcp .fold{display:none}
.rcp.open .fold{padding:0 15px 14px}
.rcp.open .fold{display:block}
.rcp .peek{font-size:11.5px;font-weight:700;color:#94a3b8;padding:10px 15px 12px}
/* v1-30: 🖤 블랙반 — 진도 레이스와 같은 접이식이되 검정·금색 */
.rcp.blk .rhd{background:linear-gradient(135deg,#15151c,#2b2b38)}
.rcp.blk .rhd .t{color:#f0c75e}
.rcp.blk .rhd .d{background:#00000055;color:#f0c75e;border:1px solid #d4af3766}
.rcp.blk .rhd .ch{color:#f0c75e}
.rcp.blk .peek{color:#94a3b8}
.rcp .sub{font-size:11.5px;font-weight:700;color:#94a3b8;margin-bottom:11px}
.rcp .pz{background:linear-gradient(135deg,#fff7e6,#fdf0d0);border:1px solid #f7dfa8;border-radius:11px;padding:9px 12px;font-size:12.5px;font-weight:800;color:#8a5a00;margin-bottom:12px}
/* v1-33: 상금을 크게 (원장님 지시) — 학부모님도 무엇이 걸린 도전인지 바로 아시게 */
.rcp .prize{background:linear-gradient(135deg,#fffdf5,#fff4d6);border:2px solid #f2cd85;border-radius:14px;padding:13px 14px 12px;text-align:center;margin-bottom:12px;box-shadow:0 2px 10px rgba(180,120,20,.13)}
.rcp .prize .lb{font-size:11.5px;font-weight:900;color:#a35a00;letter-spacing:.5px}
.rcp .prize .amt{font-size:32px;font-weight:900;line-height:1.06;margin:3px 0 1px;color:#c2410c}
.rcp .prize .amt small{font-size:18px;font-weight:900;margin-left:1px}
.rcp .prize .who{font-size:12px;font-weight:800;color:#8a5a00;margin-top:3px}
.rcp .prize .who b{color:#c2410c}
.rcp .my{display:flex;gap:7px;margin-bottom:12px}
.rcp .my .s{flex:1;background:#f4f7fb;border-radius:11px;padding:9px 6px;text-align:center}
.rcp .my .s b{display:block;font-size:18px;font-weight:900;color:#0d2240;line-height:1.2}
.rcp .my .s span{font-size:9.5px;font-weight:800;color:#94a3b8}
.rcp .bd{border-top:1px solid #f1f5f9;padding-top:10px}
.rcp .bd .bh{font-size:12px;font-weight:900;color:#0d2240;margin-bottom:6px}
.rcp .rw{display:flex;align-items:center;gap:8px;padding:7px 2px;border-top:1px solid #f8fafc}
.rcp .rw:first-of-type{border-top:none}
.rcp .rw .no{width:22px;text-align:center;font-size:13px;font-weight:900;color:#0d2240;flex-shrink:0}
.rcp .rw .em{width:15px;height:18px;flex-shrink:0;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%)}
.rcp .rw .nm{font-size:12.5px;font-weight:800;color:#0d2240}
.rcp .rw .sc{font-size:10px;font-weight:700;color:#94a3b8;margin-top:1px}
.rcp .rw .pt{margin-left:auto;font-size:13px;font-weight:900;color:#0d2240}
.rcp .rcmp{background:#f8fafc;border-radius:11px;padding:10px 12px;margin-bottom:12px}
.rcp .rcmp .t{font-size:12px;font-weight:800;color:#0d2240;margin-bottom:7px}
.rcp .rcmp .t b{color:#16a34a;font-size:14px}
.rcp .rcmp .t span{font-size:10px;font-weight:700;color:#94a3b8}
.rcp .rcmp .r{display:flex;align-items:center;gap:8px;margin-top:5px}
.rcp .rcmp .r .l{width:40px;font-size:10.5px;font-weight:800;color:#64748b;flex-shrink:0}
.rcp .rcmp .r .b{flex:1;height:9px;border-radius:5px;background:#eef2f7;overflow:hidden}
.rcp .rcmp .r .b i{display:block;height:9px;border-radius:5px}
.rcp .rcmp .r .v{width:54px;text-align:right;font-size:11px;font-weight:900;color:#0d2240;flex-shrink:0}
.rcp .note{font-size:10.5px;font-weight:700;color:#94a3b8;line-height:1.7;margin-top:10px;background:#f8fafc;border-radius:9px;padding:8px 10px}
.tabbar{position:sticky;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid #e8eef8;display:flex;padding:8px 6px calc(10px + env(safe-area-inset-bottom));margin-top:auto;z-index:50}
.tb{flex:1;text-align:center;background:none;border:none;padding:0}
.tb .ti{font-size:19px}
.tb .tl{font-size:8.5px;font-weight:800;color:#94a3b8;margin-top:2px}
.tb.on .tl{color:#1d6fe8}

/* ═══════════ 루멘수학 학부모앱 v1-4 ═══════════
 * 접속: 자녀 코드(lumen_rec_code) 6자리 — 학생앱과 동일

 * v1-3: 로드맵을 학생앱과 동일한 모양으로 이식 — 🚀 로켓 여정 요약 카드 +

async function loadAll(code){
  P.loading=true; render();
  var c=db(); if(!c){ P.loading=false; render(); return; }
  try{
    var r=await c.from('lumen_store').select('value').eq('key','or_studentdb').single();
    var arr=(r.data&&r.data.value)||[];
    P.all=Array.isArray(arr)?arr:[];
    var matches=P.all.filter(function(s){ return s&&s.lumen_rec_code===code; });
    if(!matches.length){ throw new Error('코드 ['+code+']를 찾을 수 없어요\n학원에 확인해 주세요'); }
    // v1-2: 같은 코드가 중복 등록돼 있어도 하나라도 퇴원이면 차단

    var q2=c.from('mf_students').select('mf_student_id,name,lumen_rec_code');
    var q3=c.storage.from('recordings').list(code, { limit:60, sortBy:{ column:'created_at', order:'desc' } });
    var res=await Promise.all([q1,q2,q3]);
    P.pub=null; P.prog=null; P.books=null; P.typeach=null; P.compass=null; P.amap=null; P.stuck=null; P.kmm=null; P.race=null; P.raceOpen=false; P.blk=null; P.blkOpen=false; P.mfrep=null;
    ((res[0].data)||[]).forEach(function(row){
      var v=row.value; if(typeof v==='string'){ try{ v=JSON.parse(v); }catch(e){ v=null; } }
      if(row.key==='pub_reports_'+code) P.pub=v;
      else if(row.key==='typeach_pub_'+code) P.typeach=v; // v1-5: 유형 성취 리포트 (발행분만)
      else if(row.key==='compass_pub_'+code) P.compass=v; // v1-8: 진학 나침반 (원장 발행분만)
      else if(row.key==='typeach_stu_'+code) P.amap=v;    // v1-11: 자동 성취도 (수집기 저장, 항상 최신)
      else if(row.key==='stuck_'+code) P.stuck=v;        // v1-16: 막힌 문제 (아하노트 % 분모)
      else if(row.key==='mf_progress') P.prog=v;
      else if(row.key==='mf_books') P.books=v;
      else if(row.key==='mf_kmm') P.kmm=v;               // v1-19: KMM 경시 성적·수상 (수집기 자동)
      else if(row.key==='race_board') P.race=(v&&v.at)?v:null;   // v1-24: 🏁 진도 레이스
      else if(row.key==='black_class') P.blk=(v&&Array.isArray(v.cohorts))?v:null;  // v1-30: 🖤 블랙반
      else if(row.key==='mf_report_files') P.mfrep=v;   // v1-34: 📊 매쓰플랫 월간 보고서 색인
    });
    P.mfSid=null;
    var mfs=(res[1].data)||[];
    var hit=mfs.find(function(s){ return s.lumen_rec_code===code; });
    if(!hit){ var same=mfs.filter(function(s){ return s.name===st.name; }); if(same.length===1) hit=same[0]; }
    if(hit) P.mfSid=hit.mf_student_id;
    P.recs=(res[2].data)||[];
    pLogOpen();   // v1-19: 「앱을 한 번이라도 열었는가」 기록 (학원앱 열람 현황판의 ⚪앱 미사용 판정용)
    // v1-16: 아하노트 제출 개수(최근 60일) — 「모르는 문제」 퍼센트의 분자
    P.ahaCnt={}; P.hwReady=false;
    var since60=new Date(Date.now()-60*86400000).toISOString().slice(0,10);
    c.from('aha_notes').select('created_at').eq('student_code',code).gte('created_at',since60)
      .then(function(ra){
        ((ra&&ra.data)||[]).forEach(function(x){
          var d=String((x&&x.created_at)||'').slice(0,10); if(!d) return;
          P.ahaCnt[d]=(P.ahaCnt[d]||0)+1;
        });
        P.hwReady=true; render();
      }, function(){ P.hwReady=true; render(); });
  }catch(e){
    P.st=null; P.loginErr=e.message||'연결에 실패했어요';
  }
  P.loading=false;
  if(!P.plYm){ var d=new Date(); P.plYm=d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0'); }
  render();
}

/* ── 판정 헬퍼 ── */
function plannerToday(){
  var st=P.st; if(!st) return false;
  var t=todayStr(); var ymd=t.replace(/\./g,'');
  if(st.lumen_planner&&st.lumen_planner[t]!=null) return true;
  return (st.lumen_planner_photos||[]).some(function(p){ return p&&p.setId&&String(p.setId).slice(0,8)===ymd; });
}
function recToday(){
  var iso=new Date().toISOString().slice(0,10);
  var ymd=iso.replace(/-/g,'');
  return (P.recs||[]).some(function(f){ return (f.created_at||'').slice(0,10)===iso||(f.name||'').indexOf(ymd)>=0; });
}
function weekPlanner(){
  var st=P.st; var out=[];
  var now=new Date(); var mon=new Date(now); mon.setDate(now.getDate()-((now.getDay()+6)%7));
  var names=['월','화','수','목','금'];
  for(var i=0;i<5;i++){
    var d=new Date(mon); d.setDate(mon.getDate()+i);
    var key=d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');
    var sc=st&&st.lumen_planner?st.lumen_planner[key]:null;
    out.push({ nm:names[i], score:(sc!=null?sc:null), today:key===todayStr(), future:d>now });
  }
  return out;
}
function progBooks(){
  if(!P.prog||!P.mfSid||!P.books) return [];
  var by=(P.prog.byStudent||{})[P.mfSid]||{};
  var out=[];
  Object.keys(by).forEach(function(bid){
    var pr=by[bid]; var bk=(P.books.books||{})[bid];
    if(!bk) return;
    var pct=(bk.pages&&pr.maxPage)?Math.min(100,Math.round(pr.maxPage/bk.pages*100)):null;
    out.push({ n:bk.n||('교재 '+bid), ch:pr.curChapter||'', pct:pct, maxPage:pr.maxPage||0, pages:bk.pages||0, last:pr.lastDate||'' });
  });
  out.sort(function(a,b){ return (b.last||'').localeCompare(a.last||''); });
  return out;
}

  else if(P.tab==='hw') h=vHw();           // v1-19: 숙제 탭 (플래너·녹음·월별기록)

  // v1-19: 하단 탭 5개 — 홈 / 리포트 / 숙제 / 성적 / 로드맵
  //   'amap'(성취도 자세히)·'planner'·'rec'는 각각 성적·숙제 탭 안에서 열리는 하위 화면이라
  //   탭 버튼은 부모 탭에 불을 켜 둔다(어디에 있는지 헷갈리지 않게).
  var lit=(P.tab==='amap')?'score':((P.tab==='planner'||P.tab==='rec')?'hw':P.tab);
  try{ fzApply(); }catch(e){}   // v1-30: 글씨 크기 적용 (if/else 체인 밖에서)
  app.innerHTML='<div class="view">'+h+'</div>'
    +'<div class="tabbar">'
    +tabBtn('home','🏠','홈',false,lit)

    +tabBtn('hw','📚','숙제',false,lit)
    +tabBtn('score','🏅','성적',false,lit)
    +tabBtn('roadmap','🗺️','로드맵',false,lit)
    +'</div>';
  if(P.tab==='roadmap' && window.rmParentSync) rmParentSync();
}
function tabBtn(k,ic,lb,dot,lit){

/* v1-6: 우리 아이 등수 카드 — pub_reports_ recent[]의 등수 값만 사용(새 데이터 없음), 숨김 토글 존중 */
function vRankCard(){
  var rec=P.pub&&P.pub.recent&&P.pub.recent[0];
  if(!rec) return '';
  var acadOk=rec.acadRank&&rec.acadN&&rec.showAcadRank!==false;
  var natOk=rec.rank&&rec.total&&rec.showRank!==false;
  if(!acadOk&&!natOk) return '';
  var isWeekly=rec.testType==='weekly';
  // 지난주 대비 (주간테스트끼리 비교)
  var delta='';
  if(isWeekly&&acadOk){
    var prev=(P.pub.recent||[]).slice(1).find(function(r){ return r.testType==='weekly'&&r.acadRank&&r.showAcadRank!==false; });
    if(prev&&prev.acadRank){
      var d=Number(prev.acadRank)-Number(rec.acadRank);
      delta=d>0?('▲ 지난주 '+prev.acadRank+'등'):(d<0?('▼ 지난주 '+prev.acadRank+'등'):'— 지난주와 동일');
    }
  }
  var pct=natOk?Math.max(1,Math.min(99,Math.round(Number(rec.rank)/Number(rec.total)*100))):null;
  var avgDiff=(rec.avgScore!=null&&rec.score!=null)?Math.round(Number(rec.score)-Number(rec.avgScore)):null;
  var h='<div class="rkc">';
  h+='<div class="t">🏅 우리 아이 등수</div>';
  h+='<div class="sub">'+esc(rec.date||'')+' · '+(isWeekly?'전국 주간테스트 · 같은 시험지를 푼 학생 기준':'일일테스트')+'</div>';
  // v1-7: 응시한 시험지 (학년·학기 + 범위) — 어느 학년 시험지에서의 등수인지 함께 읽히도록
  if(rec.paper&&rec.paper.label){
    h+='<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff7ed;border:1.5px solid #fed7aa;border-radius:12px;padding:8px 12px;margin:8px 0 2px;font-size:12.5px;font-weight:700;color:#9a3412">'
      +'<span style="background:#f59e0b;color:#fff;border-radius:7px;padding:2px 9px;font-size:12px;font-weight:900">'+esc(rec.paper.label)+' 과정</span>'
      +'<span>시험지'+(rec.paper.range?' · '+esc(rec.paper.range):'')+'</span></div>';
  }
  h+='<div class="rk3">';
  h+='<div class="rkb s"><div class="l">점수</div><div class="v">'+esc(rec.score!=null?rec.score:'-')+'<small>점</small></div>'+(avgDiff!=null?'<div class="d" style="color:'+(avgDiff>=0?'#059669':'#dc2626')+'">평균 '+(avgDiff>=0?'+':'')+avgDiff+'점</div>':'')+'</div>';
  if(acadOk) h+='<div class="rkb a"><div class="l">🏫 학원 등수</div><div class="v">'+rec.acadRank+'<small>등/'+rec.acadN+'명</small></div>'+(delta?'<div class="d" style="color:'+(delta.charAt(0)==='▼'?'#dc2626':'#059669')+'">'+delta+'</div>':'')+'</div>';
  if(natOk) h+='<div class="rkb n"><div class="l">🌐 전국 등수</div><div class="v">'+rec.rank+'<small>등/'+rec.total+'명</small></div><div class="d" style="color:#1d6fe8">상위 '+pct+'%</div></div>';
  h+='</div>';
  if(natOk){
    h+='<div class="rkg"><div class="gl"><span>상위</span><span>전국 '+rec.total+'명 중 내 위치</span><span>하위</span></div>'
      +'<div class="rkbar"><div class="rkdot" style="left:'+pct+'%"><div class="pin"></div><div class="pt">상위 '+pct+'%</div></div></div></div>';
  }
  // 학원 등수 흐름 (주간테스트 최근 4회)
  var flow=(P.pub.recent||[]).filter(function(r){ return r.testType==='weekly'&&r.acadRank&&r.acadN&&r.showAcadRank!==false; }).slice(0,4).reverse();
  if(flow.length>=2){
    h+='<div class="rktr"><div class="tt">📈 학원 등수 흐름 (주간테스트)</div><div class="rkbars">';
    flow.forEach(function(r,i){
      var hp=Math.max(15,Math.round((Number(r.acadN)-Number(r.acadRank)+1)/Number(r.acadN)*100));
      var hot=i===flow.length-1;
      h+='<div class="rkcol'+(hot?' hot':'')+'"><div class="bv">'+r.acadRank+'등'+(hot&&delta.charAt(0)==='▲'?' ▲':'')+'</div><div class="bar" style="height:'+hp+'%"></div><div class="bd">'+esc((r.date||'').slice(5))+'</div></div>';
    });
    h+='</div></div>';
  }
  h+='<div class="rkfoot">우리 아이의 등수만 보여드려요 — 다른 학생의 이름·점수는 표시되지 않습니다</div>';
  h+='</div>';
  return h;
}

/* ═══════════ 과제 완성도 (v1-16 → v1-17) ═══════════
 * 학원앱 v18-46이 찍은 「풀이·채점·오답」 + 앱이 계산한 「아하노트」를 학부모님께 보여준다.
 *   st.lumen_hw[YYYY-MM-DD] = {p,c,w}   (옛 기록은 'done'/'weak' 문자열)
 *   아하노트% = 그 날 올린 아하노트 수 ÷ 그 날 막힌 문제 수 (막힌 게 0개면 「해당 없음」)
 *   막힌 문제: lumen_store 'stuck_<코드>' (수집기가 새벽에 학생별로 저장)
 * 종합% = 풀이·채점·오답(+해당되면 아하노트) 단순 평균
 * 문구: 다 해온 날은 T1(학원 책임형), 나머지는 T2(담백 보고형) — 원장님 선택 2026-08-12
 *
 * v1-17 (원장님 요청 2026-08-12):
 *   ① 카드 머리를 눌러 접기·펼치기 (기본 접힘, 선택을 기억)
 *   ② 머리에 날짜·요일 배지 — 「오늘 · 8/12 (수)」 / 며칠 전이면 「8/10 (월)」
 *   ③ 「📊 N월 기록 보기」 → 월별 통계(평균·100% 일수·날짜별 막대·단계별 평균·총평)
 *   ④ 플래너·녹음을 카드 안 「집에서 할 것」으로 통합 (빨간 글씨 안 씀) */
function hwNorm(v){
  if(!v) return null;
  if(typeof v==='string'){
    if(v==='done') return {p:100,c:100,w:100};
    if(v==='weak') return {p:0,c:0,w:0};
    return null;
  }
  return {p:Number(v.p)||0, c:Number(v.c)||0, w:Number(v.w)||0};
}
function hwOf(iso){ return hwNorm(((P.st&&P.st.lumen_hw)||{})[iso]); }
function hwStuck(iso){ return ((P.stuck&&P.stuck.map)||{})[iso]||[]; }
// v1-18: 퍼센트의 분모는 「학생이 스스로 아는 막힘」만 — ❓모름 체크 · 🔁재오답
//   📉같은 유형 3회째는 시스템만 아는 신호라(학생은 3번째인 줄 모름) 점수에서 뺀다.
//   문제를 많이 풀수록 자동으로 늘어나 성실한 학생이 더 깎이던 문제를 없앤다.
var HW_SCORED={ unk:1, re:1 };
function hwStuckScored(iso){ return hwStuck(iso).filter(function(x){ return HW_SCORED[x&&x.k]; }); }
function hwAhaPct(iso){
  var n=hwStuckScored(iso).length;
  if(!n) return null;                       // 질문해야 할 막힘 없음 → 해당 없음(감점 아님)
  var got=(P.ahaCnt&&P.ahaCnt[iso])||0;
  return Math.min(100, Math.round(got/n*100));
}
function hwTotal(iso){
  var v=hwOf(iso); if(!v) return 0;
  var a=[v.p,v.c,v.w], ap=hwAhaPct(iso);
  if(ap!==null) a.push(ap);
  return Math.round(a.reduce(function(x,y){ return x+y; },0)/a.length);
}
function hwGrad(t){
  return t>=100?'linear-gradient(135deg,#059669,#10b981)'
       : t>=80?'linear-gradient(135deg,#4d7c0f,#84cc16)'
       : t>=50?'linear-gradient(135deg,#b45309,#f59e0b)'
       : 'linear-gradient(135deg,#b91c1c,#ef4444)';
}
function hwCol(t){ return t>=100?'#059669':t>=80?'#65a30d':t>=50?'#d97706':'#dc2626'; }
var HW_DOW=['일','월','화','수','목','금','토'];
function hwLatestIso(){
  var d=new Date();
  for(var i=0;i<14;i++){
    var iso=new Date(d.getTime()-i*86400000).toISOString().slice(0,10);
    if(hwOf(iso)) return iso;
  }
  return null;
}
function hwDateBadge(iso){
  var m=iso.match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!m) return iso;
  var dt=new Date(+m[1],+m[2]-1,+m[3]);
  var isToday=(iso===new Date().toISOString().slice(0,10));
  return (isToday?'오늘 · ':'')+(+m[2])+'/'+(+m[3])+' ('+HW_DOW[dt.getDay()]+')';
}
/* 한 줄 안내 — 다 해온 날 T1, 나머지 T2 */
function hwLine(iso){
  var v=hwOf(iso), ap=hwAhaPct(iso), n=hwStuckScored(iso).length;
  if(v.p>=100&&v.c>=100&&v.w>=100&&(ap===null||ap>=100))
    return ['🎉','#ecfdf5','#065f46','숙제를 빠짐없이 마쳤습니다. <b>학원에서도 크게 칭찬했습니다.</b>'];
  if(v.p<100)
    return ['📘','#eff6ff','#1e3a8a','숙제 진행 <b>'+v.p+'%</b>. 남은 분량은 <b>다음 수업에서 이어갑니다.</b>'];
  if(v.c<100)
    return ['✏️','#fffbeb','#78350f','풀이 완료 · 채점 <b>'+v.c+'%</b>. 나머지는 <b>수업 중 처리합니다.</b>'];
  if(v.w<100)
    return ['🔁','#fff7ed','#7c2d12','풀이·채점 완료 · 오답 정리 <b>'+v.w+'%</b>. 남은 오답은 <b>수업에서 다룹니다.</b>'];
  return ['🙋','#faf5ff','#5b21b6','숙제 전 단계 완료. 미해결 문항 <b>'+n+'개</b>는 <b>학원에서 확인해 지도합니다.</b>'];
}
function hwRow(n,name,color,pct,note){
  var h='<div class="hwrow">'
    +'<span class="hwn" style="background:'+color+'">'+n+'</span>'
    +'<span class="hwl">'+name+'</span>'
    +'<span class="hwt"><i style="width:'+(pct===null?0:pct)+'%;background:'+color+'"></i></span>'
    +'<span class="hwp" style="color:'+(pct===null?'#94a3b8':color)+'">'+(pct===null?'—':pct+'%')+'</span>'
    +'</div>';
  if(note) h+='<div class="hwnote">'+note+'</div>';
  return h;
}

}

/* 월별 통계 화면 */
function vHwStat(){

  for(var d=1;d<=dinm;d++){

  }

    +'<div class="kk"><b style="color:#059669">'+full+'일</b><span>100% 달성</span></div>'

      +'<div class="vl">'+x.t+'</div>'
      +'<div class="mbtr"><div class="bx" style="height:'+Math.max(x.t,6)+'%;background:'+hwGrad(x.t)+'"></div></div>'
      +'<div class="dl">'+x.d+'</div></div>';
  });
  h+='</div>';
  var sv=hwOf(sel), st=hwTotal(sel), sap=hwAhaPct(sel), sn=hwStuckScored(sel).length;
  h+='<div class="mday"><b>'+hwDateBadge(sel)+'</b> — 종합 <b style="color:'+hwCol(st)+'">'+st+'%</b><br>'

  var k=days.length;

  h+=hwRow(2,'채점하기','#f59e0b',A.c,null);

  else if(avg<60) msg=m+'월 평균 <b>'+avg+'%</b>로 숙제량을 채우지 못한 날이 많습니다 — <b>학원에서 분량을 조정하고 수업 중 시간을 확보하겠습니다.</b>';

/* ═══ v1-19: 홈 개편 ═══
 * 예전 홈은 리포트·등수·성취도·나침반·플래너·녹음·로드맵을 전부 세로로 이어 붙여
 * 스크롤이 너무 길었다. 이제 홈은 「오늘 무엇을 봐야 하는가」만 담고,
 * 자세한 내용은 아래 탭(숙제·성적·로드맵)으로 나눠 담는다.
 *   홈   = ① 학부모 리포트(가로 대형 카드, 가장 중요) ② 오늘 과제 완성도 ③ 성적 한 줄 ④ 로드맵 한 줄
 *   숙제 = 최근 7일 완성도 · 이번 주 플래너 · 녹음 · 월별 기록
 *   성적 = 등수 · 전국 위치 그래프 · 유형 성취도 · KMM 경시 · 진학 나침반
 *   로드맵 = 그대로 독립 탭 (루멘수학 시그니처)
 */
/* ═══════════════════════════════════════════════════════════════
 * 🖤 블랙반 엠블럼 (v1-30)
 * ───────────────────────────────────────────────────────────────
 * 학원앱에서 원장님이 기수에 넣으면(lumen_store 'black_class') 여기 뜬다.
 * 학부모님께는 「자랑거리」와 「설명」이 함께 필요하다 —
 * 엠블럼만 보여드리면 "왜 우리 아이만 숙제가 많나" 오해가 생길 수 있다.
 * ⚠️ 이름은 BLK/blk*로 통일 (rc*는 진도 레이스가 쓰고 있다)
 * ══════════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════════
 * 🔠 글씨 크기 (v1-30)
 * ───────────────────────────────────────────────────────────────
 * 휴대폰 화면 크기가 제각각이라(폴드~미니) 한 크기로 고정하지 않고
 * 보는 사람이 직접 고른다. 고른 값은 그 기기에만 저장된다.
 *
 * 기본값은 「크게(110%)」 — 원래 크기가 작다는 의견이 있었다.
 * zoom을 쓰는 이유: 앱이 px로 짜여 있어 rem으로 바꾸려면 수천 곳을
 * 고쳐야 한다. zoom은 화면 전체를 통째로 키워 주므로 안전하다.
 * (크롬·사파리·삼성인터넷 모두 지원)
 * ⚠️ 이름은 FZ / fz* — 다른 기능과 겹치지 않는다
 * ══════════════════════════════════════════════════════════════ */
var FZ_KEY='lumen_font_zoom';
var FZ_STEPS=[{k:'s',n:'보통',z:1},{k:'m',n:'크게',z:1.1},{k:'l',n:'아주 크게',z:1.22}];
function fzGet(){
  var v; try{ v=localStorage.getItem(FZ_KEY); }catch(e){}
  var hit=FZ_STEPS.filter(function(x){ return x.k===v; })[0];
  return hit||FZ_STEPS[1];        /* 기본 = 크게 */
}
function fzApply(){
  var z=fzGet().z;
  try{
    /* zoom을 쓰되, 안 먹는 브라우저를 위해 폰트 확대도 함께 건다 */
    document.body.style.zoom = z===1 ? '' : String(z);
    if(z!==1 && !('zoom' in document.body.style)){
      document.documentElement.style.fontSize = Math.round(16*z)+'px';
    }
  }catch(e){}
}
window.fzSet=function(k){
  try{ localStorage.setItem(FZ_KEY,k); }catch(e){}
  fzApply(); fzPaint();
};
/* 설정 칸 HTML — 두 앱에서 같은 모양으로 쓴다 */
function fzWidget(){
  var cur=fzGet().k;
  var h='<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
    +'<span style="font-size:12.5px;font-weight:900;color:#0d2240">🔠 글씨 크기</span>'
    +'<div style="display:flex;gap:5px;margin-left:auto">';
  FZ_STEPS.forEach(function(s){
    var on=s.k===cur;
    h+='<button onclick="fzSet(\''+s.k+'\')" style="padding:6px 12px;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:900;'
      +'font-size:'+(s.k==='s'?'11px':s.k==='m'?'12.5px':'14px')+';'
      +(on?'background:#0d2240;color:#fff;border:1.5px solid #0d2240'
         :'background:#fff;color:#64748b;border:1.5px solid #e2e8f0')+'">'+s.n+'</button>';
  });
  return h+'</div></div>';
}
function fzPaint(){
  try{
    var el=document.getElementById('fz-box');
    if(el) el.innerHTML=fzWidget();
  }catch(e){}
}
try{ fzApply(); }catch(e){}

function blkEmblem(no, px, past){

  var rn=['','I','II','III','IV','V','VI','VII','VIII','IX','X'][Number(no)]||String(no);
  var w=Math.round(px*0.83), big=px>=40;
  return '<svg width="'+w+'" height="'+px+'" viewBox="0 0 86 104" style="vertical-align:middle;flex:none">'
    +'<path d="M43 4 L78 15 V52 C78 74 62 90 43 99 C24 90 8 74 8 52 V15 Z" fill="'+bg+'" stroke="'+gold+'" stroke-width="'+(big?3:6)+'"/>'
    +(big?'<text x="43" y="45" text-anchor="middle" font-size="14" font-weight="900" fill="'+ink+'" font-family="Georgia,serif">BLACK</text>'
         +'<line x1="22" y1="52" x2="64" y2="52" stroke="'+gold+'" stroke-width="1" opacity=".6"/>'
         +'<text x="43" y="78" text-anchor="middle" font-size="'+(rn.length>2?20:25)+'" font-weight="900" fill="'+ink+'" font-family="Georgia,serif">'+rn+'</text>'
      :'<text x="43" y="76" text-anchor="middle" font-size="'+(rn.length>2?34:42)+'" font-weight="900" fill="'+ink+'" font-family="Georgia,serif">'+rn+'</text>')

function blkMine(){

  return (d.cohorts||[]).filter(function(c){ return !c.hidden && (c.codes||[]).indexOf(String(code))>=0; })
                        .sort(function(a,b){ return a.no-b.no; });
}

/* ══════════════════════════════════════════════════════════════
 * v1-24: 🏁 진도 레이스 (학부모용)
 * 학원에서 시험기간에 하는 문제풀이 레이스입니다. 학부모앱에서는
 * 「학원 전체 순위판」과 「우리 아이가 얼마나 풀었는지」만 보여드리고,
 * 우리 아이의 등수·리그·점수는 <b>일부러 보여드리지 않습니다</b>.
 * (아이들끼리의 경쟁이 집에서의 비교로 이어지지 않도록 — 원장님 방침)
 * ══════════════════════════════════════════════════════════════ */
var RCT={bronze:['브론즈','#a16207','linear-gradient(135deg,#d9a441,#9a6b21)'],
         silver:['실버','#64748b','linear-gradient(135deg,#e6edf5,#9aa8bb)'],
         gold:['골드','#b45309','linear-gradient(135deg,#ffd76a,#e0a219)'],
         diamond:['다이아','#0e7490','linear-gradient(135deg,#a5f3fc,#22d3ee)'],
         master:['마스터','#7c3aed','linear-gradient(135deg,#e9d5ff,#a855f7)']};
function rcpN(v){ return String(v==null?0:v).replace(/\B(?=(\d{3})+(?!\d))/g,','); }
function vRace(top){
  var b=P.race; if(!b||b.open===false) return '';
  var today=new Date(Date.now()+9*3600000).toISOString().slice(0,10);
  if(today<b.from) return '';
  // v1-27: 끝나자마자 사라지면 결과를 볼 새가 없다 — 며칠 더 「최종 결과」로 남긴다
  var ended = today>b.to;
  var overdue = ended && (Number(b.endedDays)||0) > (Number(b.showDaysAfter)||7);
  if(overdue) return '';
  var BN={elem:'초등부',mid:'중등부',high:'고등부'};
  var all=(b.elem||[]).concat(b.mid||[],b.high||[]);
  var me=all.filter(function(r){ return r.code===P.code; })[0];
  // 우리 아이가 속한 부를 먼저 보여준다 (없으면 중등부 → 고등부 → 초등부 순)
  var myBand=''; ['elem','mid','high'].forEach(function(k){ if(!myBand&&(b[k]||[]).some(function(r){return r.code===P.code;})) myBand=k; });
  if(!myBand) myBand=(b.mid||[]).length?'mid':((b.high||[]).length?'high':'elem');
  var rows=b[myBand]||[];
  var demo=((b.demoBands||['elem']).indexOf(myBand)>=0);
  var left=Math.max(0,Math.round((Date.parse(b.to+'T00:00:00')-Date.parse(today+'T00:00:00'))/86400000));
  var top=Number(b.showTop)||5;
  // v1-26: 기본은 접어 둔다 — 홈이 너무 길어지지 않게 (원장님 지시 2026-08-27)
  var open = !!P.raceOpen;
  var h='<div class="rcp'+(top===false?'':' top')+(open?' open':'')+'">';
  h+='<div class="rhd" onclick="toggleRace()"><div class="t">🏁 '+esc(b.name||'진도 레이스')+'</div>'
    +'<div class="d">'+(ended?'최종 결과':(left>0?('D-'+left):'오늘 마감'))+'</div><div class="ch">⌄</div></div>';
  // 접혀 있을 때 한 줄 요약 — 눌러야 할 이유를 준다
  if(!open){
    // v1-28: 한 줄에 들어가게 짧게 — 날짜는 월.일만, 아이 이름은 바로 위 머리에 이미 있다
    var mmdd = function(d){ return String(d||'').slice(5).replace('-','.'); };
    var peek = (ended?'끝난 레이스 · ':'') + mmdd(b.from)+' ~ '+mmdd(b.to);
    if(me) peek += ' · '+rcpN(me.n)+'문항 풀었어요';
    h+='<div class="peek">'+peek+' · <b style="color:#ef6c00">눌러서 펼치기</b></div>';
  }
  h+='<div class="fold">';
  h+='<div class="sub" style="margin-top:9px">'+esc(b.from)+' ~ '+esc(b.to)+' · 시험기간 문제풀이 레이스</div>';
  if(demo) h+='<div class="pz" style="background:linear-gradient(135deg,#f0fdf4,#dcfce7);border-color:#bbf7d0;color:#166534">🌱 <b>초등부는 「체험 리그」</b>입니다 — 시상에서는 빠지고, <b>중학생 형·누나들과 똑같은 잣대</b>로 점수만 쌓습니다</div>';
  else if(b.prizeTotal) h+='<div class="prize">'
    +'<div class="lb">🏆 이번 시즌 총상금</div>'
    +'<div class="amt">'+rcpN(b.prizeTotal)+'<small>원</small></div>'
    +'<div class="who"><b>'+b.prizeCount+'명</b> 시상 · 1·2·3등 + 꾸준상 + 성장상</div>'
    +'</div>';
  if(me){
    h+='<div style="font-size:12px;font-weight:900;color:#0d2240;margin-bottom:6px">'+esc((P.st&&P.st.name)||'우리 아이')+' 학생의 기록</div>';
    h+='<div class="my">'
      +'<div class="s"><b>'+rcpN(me.n)+'</b><span>푼 문항</span></div>'
      +'<div class="s"><b style="color:#7c3aed">'+rcpN(me.hard)+'</b><span>어려운 문제</span></div>'
      +'<div class="s"><b style="color:#059669">'+me.days+'</b><span>푼 날</span></div>'
      +'</div>';
  }
  var cm=b.compare||{};
  if(demo&&cm[myBand]&&cm.mid){
    var ce=cm[myBand], cd=cm.mid;
    /* v1-32: 「상위 5명끼리」 견준다 (원장님 지시)
     * 전체 평균은 인원 구성 탓에 불공평했다 — 중등부에 적게 푼 학생이 여럿이라
     * 평균이 초등부와 거의 같아 보였다(312 vs 352 = 89%).
     * 상위 5명끼리면 344 vs 502(69%)로 실제 격차가 드러난다.
     * 옛 순위표(top5 없음)를 만나면 예전처럼 전체 평균을 쓴다. */
    var use5 = (ce.top5N!=null && cd.top5N!=null);
    var eAvg = use5?ce.top5:ce.avg, dAvg = use5?cd.top5:cd.avg;
    var eN   = use5?ce.top5N:ce.avgN, dN = use5?cd.top5N:cd.avgN;
    var pc=Math.min(150,Math.round(eAvg/Math.max(1,dAvg)*100));
    h+='<div class="rcmp"><div class="t">📊 중학생 형·누나들과 견주면 <b>'+pc+'%</b> <span>'+(use5?'양쪽 상위 5명 평균 문항수':'1인 평균 문항수 기준')+'</span></div>'
      +'<div class="r"><span class="l">초등부</span><div class="b"><i style="width:'+Math.min(100,pc)+'%;background:linear-gradient(90deg,#4ade80,#16a34a)"></i></div><span class="v">'+rcpN(eN)+'문항</span></div>'
      +'<div class="r"><span class="l">중등부</span><div class="b"><i style="width:100%;background:linear-gradient(90deg,#93c5fd,#2563eb)"></i></div><span class="v">'+rcpN(dN)+'문항</span></div></div>';
  }
  if(rows.length){
    h+='<div class="bd"><div class="bh">🏅 '+BN[myBand]+' 순위 <span style="font-size:10px;font-weight:800;color:#94a3b8">'+top+'위까지 공개'+(demo?' · 시상 없음':'')+'</span></div>';
    rows.slice(0,top).forEach(function(r){
      var t=RCT[r.tier]||RCT.bronze;
      var medal=r.rank===1?'🥇':r.rank===2?'🥈':r.rank===3?'🥉':String(r.rank);
      h+='<div class="rw"><div class="no">'+medal+'</div><div class="em" style="background:'+t[2]+'"></div>'
        +'<div style="min-width:0"><div class="nm">'+esc(r.nm)+'</div><div class="sc">'+esc(r.gr)+' '+esc(r.sch)+'</div></div>'
        +'<div class="pt">'+rcpN(r.pts)+'</div></div>';
    });

/* ── v1-19: 🏅 KMM 경시대회 (매쓰플랫 자동 수집 · mf_kmm) ── */
var KMM_TIER={
  GRAND_PRIZE:        ['🏆 대상',   '#7c2d12', '#fef3c7'],
  GOLD_AWARD:         ['🥇 금상',   '#92400e', '#fef3c7'],
  SILVER_AWARD:       ['🥈 은상',   '#475569', '#f1f5f9'],
  BRONZE_AWARD:       ['🥉 동상',   '#9a3412', '#ffedd5'],
  ENCOURAGEMENT_AWARD:['🎖 장려상', '#3730a3', '#eef2ff'],
  NOT_AWARDED:        ['참가',      '#94a3b8', '#f8fafc']
};
var KMM_ORDER=['GRAND_PRIZE','GOLD_AWARD','SILVER_AWARD','BRONZE_AWARD','ENCOURAGEMENT_AWARD','NOT_AWARDED'];
function kmmRows(){
  var K=P.kmm; if(!K||!K.byStudent||!P.mfSid) return null;
  var arr=K.byStudent[String(P.mfSid)]||K.byStudent[P.mfSid];
  if(!arr||!arr.length) return null;
  // 최근 회차가 앞 (수집기가 이미 정렬하지만 한 번 더 보장)
  var rows=arr.slice().sort(function(a,b){ return String(b.ym).localeCompare(String(a.ym)); });
  // 최고 수상 등급
  var best=null;
  KMM_ORDER.forEach(function(t){
    if(best) return;
    var hit=rows.find(function(x){ return x.tier===t; });
    if(hit&&t!=='NOT_AWARDED') best={ tier:t, label:KMM_TIER[t][0].replace(/^\S+\s/,''), row:hit };
  });
  return { rows:rows, best:best, nAward:rows.filter(function(x){ return x.tier&&x.tier!=='NOT_AWARDED'; }).length };
}

  var K=kmmRows(); if(!K) return '';

    +'회차마다 응시 인원과 난이도가 달라 등수끼리 비교하기 어렵기 때문입니다.'

  h+='</div>';
  return h;

/* v1-5: 유형 성취 리포트 (신호등 → 성장 스토리) — 학원앱 「학부모앱 발행」분만 표시 */
/* ── v1-11: 🚦 우리 아이 성취도 (자동 · typeach_stu) ── */
function amapRows(){
  var d=P.amap||{}; var mine=d.mine||{}; var names=d.names||{};
  var ps=Object.keys(mine).sort(); if(!ps.length) return null;
  var cur=ps[ps.length-1], prev=ps.length>=2?ps[ps.length-2]:null;
  var c=mine[cur]||{}, p=prev?(mine[prev]||{}):{};
  function rate(a){ return (a&&a[0]>=3)?Math.round(a[1]/a[0]*100):null; }
  var rows=Object.keys(c).map(function(cid){
    return { cid:cid, r:rate(c[cid]), rp:prev?rate(p[cid]):null, n:c[cid][0], k:c[cid][1],
      name:(names[cid]&&names[cid].n)||'', unit:(names[cid]&&names[cid].m)||'기타' };
  }).filter(function(x){ return x.r!=null; });
  if(!rows.length) return null;
  var t=0,k=0; rows.forEach(function(x){ t+=x.n; k+=x.k; });
  var pT=0,pK=0; if(prev) Object.keys(p).forEach(function(cid){ if(rate(p[cid])!=null){ pT+=p[cid][0]; pK+=p[cid][1]; } });
  return { rows:rows, pct:t?Math.round(k/t*100):0, t:t,
    dpct:(prev&&pT)?(t?Math.round(k/t*100):0)-Math.round(pK/pT*100):null };
}
function vAmapCard(){
  var A=amapRows(); if(!A) return '';
  var ng=A.rows.filter(function(x){return x.r>=80;}).length, ny=A.rows.filter(function(x){return x.r>=60&&x.r<80;}).length, nr=A.rows.filter(function(x){return x.r<60;}).length;
  var gcol=A.pct>=80?'#22c55e':A.pct>=60?'#eab308':'#ef4444';
  var h='<div onclick="goTab(\'amap\')" style="cursor:pointer;margin:12px 16px 0;background:#fff;border:2px solid #bbf7d0;border-radius:18px;padding:15px;box-shadow:0 6px 18px rgba(13,34,64,.08)">';

// v1-14: 리포트 열람 기록 — 학원앱 발행 현황판의 「👁 학부모 열람」 표시용.
// 화면에는 아무것도 표시되지 않음. 자녀별로 앱 세션당 1회만 기록.
// v1-15: 「어느 날짜 리포트를 봤는지」까지 기록 — 기존엔 마지막 열람 시각 하나만 남아
//   학원앱 8/10 목록에 8/11 열람이 붙는 등 날짜가 섞여 보였다.
//   value = { at, dates: { '2026.08.10': '열람시각', ... } } (누적, 최근 60개 유지)
// v1-19: 「탭을 눌렀다」가 아니라 「본문을 3초 이상 봤다」를 읽음으로 친다.
//   예전엔 리포트 탭을 스치기만 해도 읽음으로 기록돼, 학원앱에서 🟢인데
//   실제로는 안 읽은 경우가 생겼다. 이제 조건 세 가지를 모두 만족해야 기록한다.
//     ① 리포트 탭에 있고  ② 화면이 켜져 있고(다른 앱으로 안 넘어감)  ③ 3초가 지났다
var _readLogged={}, _readTimer=null;
window.pArmRead=function(){
  if(_readTimer) return;                       // 이미 재고 있으면 그대로
  if(!P.code || _readLogged[P.code]) return;
  _readTimer=setTimeout(function(){
    _readTimer=null;
    if(P.tab!=='report') return;               // 3초 안에 다른 탭으로 갔다 → 읽음 아님
    try{ if(document.hidden) return; }catch(e){}// 화면이 꺼졌거나 다른 앱 → 읽음 아님
    pLogRead();
  }, 3000);
};
window.pDisarmRead=function(){ if(_readTimer){ clearTimeout(_readTimer); _readTimer=null; } };
function pLogRead(){
  try{
    if(!P.code || _readLogged[P.code]) return;
    var c=db(); if(!c) return;
    _readLogged[P.code]=true;
    var now=new Date().toISOString();
    // 이 학생에게 발행된 리포트 날짜들을 열람한 것으로 기록 (화면에 실제로 보이는 목록 기준)
    var ds=[];
    try{
      ((P.pub&&P.pub.recent)||[]).forEach(function(x){
        var d=String((x&&x.date)||'').trim(); if(d && ds.indexOf(d)<0) ds.push(d);
      });
    }catch(e){}
    c.from('lumen_store').select('value').eq('key','rep_read_'+P.code).then(function(r){
      var prev=(r&&r.data&&r.data[0]&&r.data[0].value)||{};
      if(typeof prev==='string'){ try{ prev=JSON.parse(prev); }catch(e){ prev={}; } }
      var dates=(prev&&prev.dates)||{};
      ds.forEach(function(d){ dates[d]=now; });
      // 최근 60개만 유지
      var keys=Object.keys(dates).sort();
      while(keys.length>60){ delete dates[keys.shift()]; }
      c.from('lumen_store').upsert({key:'rep_read_'+P.code, value:{at:now, dates:dates}, updated_at:now},{onConflict:'key'}).then(function(){},function(){});
    },function(){
      c.from('lumen_store').upsert({key:'rep_read_'+P.code, value:{at:now}, updated_at:now},{onConflict:'key'}).then(function(){},function(){});
    });
  }catch(e){}
}

/* ── v1-19: 앱 접속 기록 (화면에는 안 보임) ──────────────────────────────
 * 학원앱 발행 현황판에서 「아직 안 읽음」이 두 가지 뜻으로 섞여 있었다.
 *   ⓐ 앱은 쓰는데 이번 리포트만 아직 안 봄  → 한 번 더 알려드리면 된다
 *   ⓑ 앱 자체를 한 번도 안 열어봄          → 설치·코드 안내부터 다시 해야 한다
 * 이 둘은 대응이 완전히 다르므로, 「앱을 연 적이 있는가」를 따로 남긴다.
 * parent_open_<코드> = { at: 마지막 접속, first: 처음 접속, n: 접속 횟수 }
 * 세션당 1회만 기록해 서버 부담을 늘리지 않는다. */
var _openLogged={};
function pLogOpen(){
  try{
    if(!P.code || _openLogged[P.code]) return;
    var c=db(); if(!c) return;
    _openLogged[P.code]=true;
    var key='parent_open_'+P.code, now=new Date().toISOString();
    c.from('lumen_store').select('value').eq('key',key).then(function(r){
      var prev=(r&&r.data&&r.data[0]&&r.data[0].value)||{};
      if(typeof prev==='string'){ try{ prev=JSON.parse(prev); }catch(e){ prev={}; } }
      var v={ at:now, first:prev.first||now, n:(Number(prev.n)||0)+1 };
      c.from('lumen_store').upsert({key:key, value:v, updated_at:now},{onConflict:'key'}).then(function(){},function(){});
    },function(){
      c.from('lumen_store').upsert({key:key, value:{at:now, first:now, n:1}, updated_at:now},{onConflict:'key'}).then(function(){},function(){});
    });
  }catch(e){}
}

  });

function courseFromName(name){
  if(!name) return -1;
  var m=String(name).match(/(초|중|고)\s*(\d)\s*[-–]\s*(\d)/);
  if(m){
    if(m[1]==='고'){
      var hsMap={'1-1':'공수1','1-2':'공수2','2-1':'대수','2-2':'미적Ⅰ','3-1':'확통','3-2':'미적Ⅱ'};
      return COURSES.indexOf(hsMap[m[2]+'-'+m[3]]||'');
    }
    return COURSES.indexOf(m[1]+m[2]+'-'+m[3]);
  }
  if(/공통수학\s*1|공수\s*1/.test(name)) return COURSES.indexOf('공수1');
  if(/공통수학\s*2|공수\s*2/.test(name)) return COURSES.indexOf('공수2');
  if(/미적분\s*(Ⅱ|II|2)/.test(name)) return COURSES.indexOf('미적Ⅱ');
  if(/미적분\s*(Ⅰ|I|1)?/.test(name) && /미적분/.test(name)) return COURSES.indexOf('미적Ⅰ');
  if(/확률과\s*통계|확통/.test(name)) return COURSES.indexOf('확통');
  if(/대수/.test(name)) return COURSES.indexOf('대수');

}

// ── 단원 목록 정규화: or_books의 units(배열/줄바꿈 문자열) → [{id,name}] ──
function bookUnits(b){
  var u=b&&b.units;
  if(typeof u==='string') u=u.split(/\n/).map(function(s){return s.trim();}).filter(function(s){return s;});
  if(!Array.isArray(u)||!u.length) return null;
  return u.map(function(it,i){
    if(typeof it==='string') return {id:'u'+pad2(i+1), name:it};
    return {id:it.id||('u'+pad2(i+1)), name:it.name||it.title||('단원 '+(i+1))};
  });
}

function bookPct(b){
  var us=bookUnits(b); if(!us) return null;
  var p=rmProg[b.id]||{}; var done=0;
  us.forEach(function(u){ if(p[u.id]&&p[u.id].on) done++; });
  return { done:done, total:us.length, pct:Math.round(done/us.length*100) };
}

// ── 최전선(현재 위치) 인덱스 ──
function frontIdx(){
  var f=-1;
  rmBooks.forEach(function(it){
    if(it.ci<0) return;
    var pr=bookPct(it.b);
    var active = pr ? pr.pct<100 : true;
    if(active && it.ci>f) f=it.ci;
  });
  if(f<0) rmBooks.forEach(function(it){ if(it.ci>f) f=it.ci; });
  if(f<0) f=schoolIdx();
  return f;
}

function gapInfo(){
  var f=frontIdx(), s=schoolIdx();
  if(f<0) return { f:f, s:s, lead:'🗺️ 나의 로드맵', sub:'교재가 배정되면 위치가 계산돼요' };
  if(s<0) return { f:f, s:s, lead:'🚀 현재 과정: '+COURSES[f], sub:'' };
  var d=f-s;
  if(d>0) return { f:f, s:s, lead:'🚀 선행 +'+d+'학기', sub:'학교보다 '+(d>=2?(Math.floor(d/2)+'년'+(d%2?' 반':'')+' '):'')+'앞서 달리는 중!' };
  if(d===0) return { f:f, s:s, lead:'🏃 학교 진도와 나란히', sub:'현행 과정을 착실하게!' };
  return { f:f, s:s, lead:'🌱 개념 다지기 집중 구간', sub:'단단히 다진 만큼 뒤가 빨라져요' };
}

function journeyPct(f){
  if(f<0) return 0;
  var best=null;
  rmBooks.forEach(function(it){
    if(it.ci!==f) return;
    var p=bookPct(it.b);
    if(p && (best===null||p.pct>best)) best=p.pct;
  });
  var frac=(best===null)?0:best/100;
  return Math.min(100, Math.round((f+frac)/COURSES.length*100));
}

// ── 예상 마무리 (최근 4주 체크 속도) ──
function forecast(it){
  var us=bookUnits(it.b); if(!us) return null;
  var p=rmProg[it.b.id]||{}; var done=0, recent=0, now=Date.now();
  us.forEach(function(u){
    var e=p[u.id];
    if(e&&e.on){ done++; var t=Date.parse(e.t||''); if(t&&(now-t)<28*86400000) recent++; }
  });
  var left=us.length-done;
  if(left<=0) return { txt:'완주 🏅', warn:false, done:true };
  if(recent<=0) return null;
  var weeks=left/(recent/4);
  var d=new Date(now+weeks*7*86400000);
  var seg=d.getDate()<=10?'초':(d.getDate()<=20?'중':'말');
  var gd=pdate(it.a&&it.a.goalDate);
  var warn=!!(gd&&d>gd);
  return { txt:'예상 '+(d.getMonth()+1)+'월 '+seg+(warn?' ⚠️':' ✅'), warn:warn, done:false };
}

function datesLine(it){
  var parts=[];
  var sd=pdate(it.a&&it.a.startDate);
  var gd=pdate(it.a&&it.a.goalDate);
  if(sd) parts.push('🚩 '+(sd.getMonth()+1)+'.'+sd.getDate()+' 시작');
  if(gd) parts.push('🎯 목표 '+(gd.getMonth()+1)+'월');
  var fc=forecast(it);
  if(fc&&!fc.done) parts.push('📈 '+fc.txt);
  return parts.join(' · ');
}

function unitState(uid){

function rmRenderUnits(){
  var us=bookUnits(rmCur.b)||[];
  var done=0, firstOff=-1;
  us.forEach(function(u,i){
    var st=unitState(u.id);
    if(st&&st.on) done++;
    else if(firstOff<0) firstOff=i;
  });
  var pct=us.length?Math.round(done/us.length*100):0;
  document.getElementById('rm-mbarFill').style.width=pct+'%';
  document.getElementById('rm-mcnt').textContent=done+' / '+us.length+' 단원';
  document.getElementById('rm-mpct').textContent=pct+'%';
  var h='';
  us.forEach(function(u,i){
    var st=unitState(u.id);
    var on=!!(st&&st.on);
    var lab;
    if(on){
      var t=st.t?new Date(st.t.replace('T',' ').replace(/-/g,'/')):null;
      lab=(t&&!isNaN(t))?((t.getMonth()+1)+'.'+t.getDate()+' ✓'):'✓';

  });

// ── v2-5: 매쓰플랫 자동 진도 로드 (mf_progress + mf_books, 학생→sid 매칭) ──
async function rmLoadMf(){
  rmMf={ books:[], months:[], loaded:true };
  if(isTest||!window.sb||!studentInfo) return;
  try{
    var r=await sb.from('lumen_store').select('key,value').in('key',['mf_progress','mf_books']);
    var prog=null, cat=null;
    (r.data||[]).forEach(function(row){
      var v=row.value; try{ if(typeof v==='string') v=JSON.parse(v); }catch(e){}
      if(row.key==='mf_progress') prog=v; else if(row.key==='mf_books') cat=v;
    });
    if(!prog||!cat) return;
    // 학생 → mf_student_id 매칭 (아하노트·스포트라이트와 동일 규칙)
    var r2=await sb.from('mf_students').select('mf_student_id,name,lumen_rec_code');
    var list=(r2&&r2.data)||[]; var m=null;
    for(var i=0;i<list.length;i++){ if(list[i].lumen_rec_code&&list[i].lumen_rec_code===studentInfo.lumen_rec_code){ m=list[i]; break; } }
    if(!m){ var same=list.filter(function(x){ return x.name===studentInfo.name; }); if(same.length===1) m=same[0]; }
    if(!m) return;
    var sid=m.mf_student_id;
    var pBooks=(prog.byStudent&&prog.byStudent[sid])||{};
    var meta=cat.books||{};
    var s=schoolIdx();
    var monthAgg={};
    /* v1-22: 「진도 / 복습」을 학교 학년이 아니라 «이 학생이 실제로 어디까지 나갔는가»로 나눈다.
     * 예전에는 학교 학년(초6)보다 위면 전부 「선행」이라, 지금 나가는 중1(하)와
     * 복습으로 다시 푸는 중1(상)이 똑같이 「선행」으로 보였다(원장님 지적).
     * 이제 최근에 채점 기록이 있는 교재 중 «가장 앞선 학기»를 그 학생의 진도로 보고,
     *   그 학기 교재  → 📘 진도 (지금 나가는 중)
     *   그보다 앞 학기 → 🔁 복습 (다시 다지는 중)
     *   그보다 뒤 학기 → 🚀 선행 (진도보다 더 앞서 손댄 것)
     * 학교보다 얼마나 앞서는지는 없어지지 않고 배지에 「선행 +N학기」로 함께 적는다. */
    var CUT=new Date(Date.now()-90*86400000).toISOString().slice(0,10);   // 최근 90일
    var front=-1, frontAny=-1;
    Object.keys(pBooks).forEach(function(bid){
      var md=meta[bid]||{}, pr=pBooks[bid]||{};
      var ci=courseFromName(md.g||md.n||'');
      if(ci<0) return;
      if(ci>frontAny) frontAny=ci;
      if((pr.lastDate||'')>=CUT && ci>front) front=ci;      // 최근에 실제로 나간 것만
    });
    if(front<0) front=frontAny;                              // 최근 기록이 없으면 전체 기준
    rmMf.front=front;
    Object.keys(pBooks).forEach(function(bid){
      var md=meta[bid]||{}; var pr=pBooks[bid]||{};
      var ci=courseFromName(md.g||md.n||'');
      var track=(ci<0||front<0)?'진도':(ci===front?'진도':(ci<front?'복습':'선행'));
      rmMf.books.push({ id:bid, name:md.n||'교재', g:md.g||'', pages:md.pages||0, units:md.units||[], prog:pr, ci:ci, track:track });
      // 월별 병합
      var mo=pr.months||{};
      Object.keys(mo).forEach(function(ym){
        var a=monthAgg[ym]=monthAgg[ym]||{ ym:ym, c:0, t:0, books:[] };
        a.c+=mo[ym].c||0; a.t+=mo[ym].t||0;
        a.books.push({ name:md.n||'교재', c:mo[ym].c||0, t:mo[ym].t||0, maxP:mo[ym].maxP||0 });
      });
    });
    // 트랙 우선순위: 현행 > 선행(가까운 순) > 복습, 그 안에서 최근 학습 순
    var ord={ '진도':0, '선행':1, '복습':2 };   // v1-22
    rmMf.books.sort(function(a,b){
      return (ord[a.track]-ord[b.track]) || (String((b.prog&&b.prog.lastDate)||'').localeCompare(String((a.prog&&a.prog.lastDate)||'')));
    });
    rmMf.months=Object.keys(monthAgg).sort().map(function(ym){
      var a=monthAgg[ym]; a.rate=a.t?Math.round(a.c/a.t*100):0; return a;
    });
    // v2-9: '앞으로' 예정용 — 원장님 계획 큐(lumen_roadmap_plan) + 교재명 사전(or_books)
    rmMf.plan=(studentInfo&&studentInfo.lumen_roadmap_plan)||null;
    rmMf.booksById={};
    try{
      var rb=await sb.from('lumen_store').select('value').eq('key','or_books').single();
      var allB=(rb&&rb.data&&rb.data.value)||[];
      if(typeof allB==='string'){ try{ allB=JSON.parse(allB); }catch(e){ allB=[]; } }
      if(Array.isArray(allB)) allB.forEach(function(b){ if(b&&b.id) rmMf.booksById[b.id]={ name:b.name||'', ci:courseFromName(b.name||'') }; });
    }catch(e){}
  }catch(e){ console.warn('매쓰플랫 진도 로드 실패:', e); }
}

/* v1-21: 「곧 완주」 판정을 고쳤다.
 * 예전 기준은 「남은 단원 ≤ 2」라는 절대값이었다. 그런데 RPM 중등수학1(상)처럼
 * 목차가 4단원뿐인 교재는 2단원 남은 것이 「절반」인데도 곧 완주로 잡혔다
 * (39쪽까지 나간 교재가 「곧 완주」로 뜨는 앞뒤 안 맞는 화면의 원인).
 * 이제 남은 단원이 전체의 1/4 이하일 때만 곧 완주로 본다.
 *   4단원 교재 → 마지막 단원(0) 또는 1단원 남았을 때만
 *   8단원 교재 → 2단원 남았을 때부터 */
function rmNearEnd(bk){
  var toc=(bk&&bk.units)||[];
  var rem=rmRemainingUnits(bk);
  if(rem===null||!toc.length) return null;
  var near=(rem===0)||(toc.length>=4 && (rem/toc.length)<=0.25);
  return near?{ rem:rem, total:toc.length }:null;
}
// v2-9: 현재 교재의 남은 단원 수(목차 순서, 현재 단원 이후) — null이면 판정 불가
function rmRemainingUnits(bk){
  var toc=(bk&&bk.units)||[]; if(!toc.length) return null;
  var cur=(bk.prog&&bk.prog.curChapter)||''; if(!cur) return null;
  function nrm(x){ return String(x||'').replace(/[\s\.\-–·()\[\]0-9ⅠⅡⅢⅣⅤⅥⅦ]/g,'').replace(/[a-zA-Z]/g,'').toLowerCase(); }
  var ci=-1; toc.forEach(function(u,i){ if(nrm(u)===nrm(cur)) ci=i; });
  if(ci<0) return null;
  return Math.max(0, toc.length-1-ci);
}
// v2-9: 로켓 위 '앞으로(예정)' — 곧 완주 + 원장 계획 큐 + 먼 미래 교육과정 추측(흐림)
function rmAheadHtml(curYm){
  var s=schoolIdx();
  var items=[]; // 가까운 것부터
  // v1-21: 「곧 완주」를 여기(예정)에서 뺐다.
  //   지금 풀고 있는 교재가 위쪽 「앞으로(예정)」에도, 아래쪽 현재 목록에도 나와
  //   같은 교재가 두 번 보였다(위에서는 「곧 완주」, 아래에서는 「1단원 진행 중」 —
  //   학부모가 보면 앞뒤가 안 맞는다). 곧 완주는 「예정」이 아니라 「지금 하는 것」이므로
  //   아래 현재 카드에 🏁 배지로만 표시한다.
  // 다음 교재 큐 (원장 계획)
  var covered={};
  var plan=(rmMf.plan&&rmMf.plan.queue)||[];
  plan.slice(0,3).forEach(function(q){
    if(!q||!q.bookId) return;
    var b=rmMf.booksById&&rmMf.booksById[q.bookId]; if(!b||!b.name) return;
    if(b.ci>=0) covered[b.ci]=1;
    items.push({ side:'R', tc:'adv', badge:'📋 계획', name:b.name, sub:'원장님이 정해 둔 다음 교재', op:1 });
  });
  // 3) 먼 미래 교육과정 추측 (선행 최전선 다음, 큐가 커버한 과정 제외) — 최대 3개
  var front=-1; rmMf.books.forEach(function(bk){ if(bk.ci>front) front=bk.ci; });
  if(front<0) front=s;
  /* v1-23: 「앞으로 갈 길」이 안 보인다는 지적 반영.
   *   ① 너무 흐렸다 — 어두운 배경에 opacity 0.35까지 내려가 글씨가 거의 안 읽혔다.
   *      이제 0.72 아래로는 내리지 않는다.
   *   ② 내용이 학기 이름뿐이었다 — 「중2-1」만 있으면 여정으로 읽히지 않는다.
   *      순서(다음 · 2번째 …)와 학교 대비 선행 정도를 함께 적는다.
   *   ③ 4개까지 보여 목표까지 이어지는 느낌을 준다. */
  var gc=0;
  if(front>=0){
    for(var i=front+1; i<COURSES.length && gc<4; i++){
      if(covered[i]) continue;
      var lead=(s>=0)?(i-s):0;
      items.push({ side:'R', tc:'adv',
        badge:(gc===0?'⭐ 다음':(gc+1)+'번째'),
        name:COURSES[i],
        sub:(lead>0?'학교보다 +'+lead+'학기 앞서서':''),
        op:Math.max(0.72,0.98-gc*0.07), guess:true });
      gc++;
    }
  }
  if(!items.length) return '';
  items=items.slice(0,6);
  items.reverse(); // 먼 미래가 위로
  var left=(front>=0)?(COURSES.length-1-front):0;
  var univ=(rmGoal&&rmGoal.univ)||'';
  var h='<div class="rm-tlahead-h">🔜 앞으로 갈 길</div>';
  h+='<div class="rm-tlahead-s">'
    +(left>0?('목표까지 남은 과정 <b>'+left+'개</b>'+(univ?' · '+esc(univ):'')):'거의 다 왔어요!')
    +'</div>';
  // 안내는 제목 바로 아래에 — 카드 아래에 두면 로켓(현재 위치)과 겹친다
  h+='<div class="rm-tlahead-f">※ 교육과정 순서로 보여드리는 <b>예상</b>이에요<br>실제 순서와 시기는 아이 상태를 보고 원장님이 정합니다</div>';
  items.forEach(function(it){
    var card='<div class="rm-tlplan '+it.tc+'" style="opacity:'+it.op+'">'
      +'<div class="rm-tlpb"><span class="rm-tlbadge" style="'+(it.guess?'background:#334d70;':'')+'">'+esc(it.badge)+'</span></div>'
      +'<div class="rm-tlnm" style="font-size:12px">'+esc(it.name)+'</div>'
      +(it.sub?'<div class="rm-tlmeta" style="color:#a8c6ee">'+esc(it.sub)+'</div>':'')+'</div>';
    h+='<div class="rm-tlrow"><div class="rm-tlL">'+(it.side==='L'?card:'')+'</div>'
      +'<div class="rm-tlC"><span class="rm-tldot" style="opacity:.75;width:11px;height:11px"></span></div>'
      +'<div class="rm-tlR">'+(it.side==='R'?card:'')+'</div></div>';
  });
  return h;
}

/* v1-22: 교재 배지 — 「무엇을 하는 중인가(진도/복습/선행)」 + 「어느 학기인가」
 *   진도: 📘 진도 · 선행 +3학기   (학교보다 앞서면 그 정도를 함께)
 *   복습: 🔁 복습 · 중1-1        (어느 학기를 다시 도는지)
 *   선행: 🚀 선행 +N학기 */
function rmBadgeOf(bk){
  var s=schoolIdx(), ci=(bk&&bk.ci!=null)?bk.ci:-1;
  var sem=(ci>=0&&COURSES[ci])?COURSES[ci]:'';
  if(bk.track==='복습') return '🔁 복습'+(sem?' · '+sem:'');
  var lead=(ci>=0&&s>=0)?(ci-s):0;
  if(bk.track==='선행') return '🚀 선행'+(lead>0?' +'+lead+'학기':'');
  return '📘 진도'+(lead>0?' · 선행 +'+lead+'학기':(sem?' · '+sem:''));
}
// v1-22: 진도·선행은 오른쪽(보라), 복습은 왼쪽(파랑)
function rmTcOf(bk){ return (bk.track==='복습')?'back':'adv'; }
// 한 교재 트랙 카드 + 단원 노선
function rmTrackHTML(bk){
  var pr=bk.prog||{}; var tc=rmTcOf(bk);   // v1-22
  // v2-6: 교재 총페이지를 아는 경우에만 %; 모르면 도달 페이지를 대표값으로(잘못된 0% 방지)
  var hasPct=(bk.pages>0&&pr.maxPage);
  var pct=hasPct?Math.min(100,Math.round(pr.maxPage/bk.pages*100)):0;
  var head=hasPct?(pct+'%'):(pr.maxPage?(pr.maxPage+'쪽'):'진행 중');
  var badge=rmBadgeOf(bk);   // v1-22
  var open=!!rmRouteOpen[bk.id];
  var meta=[];
  if(pr.maxPage) meta.push(pr.maxPage+(bk.pages?' / '+bk.pages+'쪽':'쪽 도달'));
  if(pr.curChapter) meta.push('현재 '+esc(pr.curChapter));
  if(pr.weekPages&&pr.weekPages<pr.maxPage) meta.push('이번 주 +'+pr.weekPages+'쪽');
  if(pr.lastDate) meta.push('채점 '+pr.lastDate.slice(5).replace('-','.'));
  var h='<div class="rm-trk '+tc+'" onclick="rmToggleRoute(\''+esc(bk.id)+'\')">';
  h+='<div class="rm-thead"><span class="rm-tbadge">'+esc(badge)+'</span><span class="rm-tname">'+esc(bk.name)+'</span><span class="rm-tpct">'+head+'</span></div>';
  h+='<div class="rm-tmeta">'+(meta.length?meta.join(' · '):'채점 기록 대기 중')+' <span style="color:#6ee7b7">🤖 자동</span></div>';
  var ne=rmNearEnd(bk);   // v1-21
  if(ne) h+='<div class="rm-tlsoon">🏁 '+(ne.rem===0?'마지막 단원이에요':'곧 완주 · 남은 '+ne.rem+'단원')+'</div>';
  if(hasPct) h+='<div class="rm-tbar"><i style="width:'+pct+'%"></i></div>';
  h+='<div class="rm-ttap">'+(open?'▲ 접기':'▼ 탭하면 단원 노선')+'</div>';
  h+='<div class="rm-route'+(open?' open':'')+'">'+rmRouteHTML(bk)+'</div>';
  h+='</div>';
  return h;
}

function rmRouteHTML(bk){
  var pr=bk.prog||{}; var chs=pr.chapters||[];
  var toc=bk.units||[];
  if(!chs.length&&!toc.length) return '<div class="rm-tnone">아직 채점 기록이 없어요 — 매쓰플랫에서 채점하면 단원 진도가 자동으로 표시돼요.</div>';
  // 정규화 매칭용
  function norm(x){ return String(x||'').replace(/[\s\.\-–·()\[\]0-9ⅠⅡⅢⅣⅤⅥⅦ]/g,'').replace(/[a-zA-Z]/g,'').toLowerCase(); }
  var studied={}; chs.forEach(function(c){ studied[norm(c.n)]=c; });
  var curKey=norm(pr.curChapter);
  var rows=[];
  // 목차가 있으면 목차 순서로, 없으면 학습한 단원 순서로
  var seq=toc.length? toc.slice() : chs.map(function(c){ return c.n; });
  // 학습했지만 목차에 없는 단원 보강
  if(toc.length){ chs.forEach(function(c){ var f=false; toc.forEach(function(t){ if(norm(t)===norm(c.n)) f=true; }); if(!f) seq.push(c.n); }); }
  var curIdx=-1;
  seq.forEach(function(nm,i){ if(norm(nm)===curKey||(studied[norm(nm)]&&studied[norm(nm)]===studied[curKey])) curIdx=i; });
  var h='';
  seq.forEach(function(nm,i){
    var st=studied[norm(nm)];
    var isCur=(curKey&&norm(nm)===curKey);
    // v2-7: 현재 단원보다 앞(목차 순서)이면 채점 기록이 아직 없어도 '완료'로 추론
    //       (오래된 단원은 수집 범위 밖이라 데이터가 없을 수 있음)
    var isDone=!isCur&&curIdx>=0&&i<curIdx;
    var cls=isCur?'cur':((isDone||st)?'done':'');
    var last=(i===seq.length-1);
    h+='<div class="rm-u '+cls+'"><div class="rm-ur"><div class="ud"></div>'+(last?'':'<div class="ul"></div>')+'</div><div class="rm-ux">';
    var mark=(isDone||(st&&!isCur))?'✓ ':'';
    h+='<div class="un">'+mark+esc(nm)+'</div>';
    if(isCur){
      var rate=(st&&st.total)?Math.round(st.correct/st.total*100):null;
      var p2=[]; if(rate!=null) p2.push('정답률 '+rate+'%'); if(st&&st.total) p2.push(st.total+'문항');
      h+='<div class="rm-upin"><div class="p1">📍 지금 여기'+(pr.maxPage?' · '+pr.maxPage+'쪽':'')+'</div>'+(p2.length?'<div class="p2">'+p2.join(' · ')+'</div>':'')+(rate!=null?'<div class="pb"><i style="width:'+rate+'%"></i></div>':'')+'</div>';
    } else if(st){
      var rr=(st.total)?Math.round(st.correct/st.total*100):null;
      h+='<div class="um">'+(st.minP?st.minP+'~'+st.maxP+'쪽':'')+(rr!=null?' · 정답률 '+rr+'%':'')+(st.lastDate?' · '+st.lastDate.slice(5).replace('-','.'):'')+'</div>';
    } else if(isDone){
      h+='<div class="um">완료</div>';
    } else {
      h+='<div class="um">예정</div>';
    }
    h+='</div></div>';
  });
  return h;
}

    var lead=(fi>=0&&s>=0)?(fi-s):0;
    h+='<div class="rm-dual"><span><i class="kr"></i>📘 진도'+(fLbl?' ('+esc(fLbl)+')':'')
      +(lead>0?' · 선행 +'+lead+'학기':'')+'</span><span><i class="kb"></i>🔁 복습</span></div>';
    h+=rmMonthTimelineHtml();
    h+='<div class="rm-tlstart"><div class="ce">🌱</div><div class="ct">여정 시작</div></div>';
    // v1-21: 「진도가 안 맞는 것 같다」는 오해를 줄이려고 기준 시점을 밝힌다.
    //   매쓰플랫 채점 기록을 매일 새벽에 한 번 가져오므로, 오늘 푼 것은 내일 아침에 나타난다.
    h+='<div class="rm-tlbasis">📡 매쓰플랫 채점 기록 자동 반영'
      +(rmLastGraded()?(' · 마지막 채점 <b>'+esc(rmLastGraded().replace(/-/g,'.'))+'</b>'):'')
      +'<br>매일 새벽에 한 번 가져옵니다 — 오늘 푼 것은 내일 아침에 나타나요</div>';
  } else if(rmMf.loaded){
    h+='<div class="rm-tnone" style="margin:14px 2px">📚 매쓰플랫 채점 기록이 쌓이면 여기에 월별 여정이 자동으로 나타나요.</div>';
  } else {
    h+='<div class="rm-loading" style="padding:26px 0">불러오는 중…</div>';
  }
  box.innerHTML=h;
}

// v1-21: 이 학생의 교재 전체에서 가장 최근 채점일
function rmLastGraded(){
  var last='';
  (rmMf.books||[]).forEach(function(bk){
    var d=(bk.prog&&bk.prog.lastDate)||'';
    if(d&&d>last) last=d;
  });
  return last;
}
// v2-8: 월별 타임라인 (현행 왼쪽 / 선행 오른쪽, 최신 달=현재+로켓, 탭하면 단원 노선)
function rmMonthTimelineHtml(){
  var map={};
  rmMf.books.forEach(function(bk){
    var mo=(bk.prog&&bk.prog.months)||{};
    Object.keys(mo).forEach(function(ym){ (map[ym]=map[ym]||[]).push({ bk:bk, m:mo[ym] }); });
  });
  var yms=Object.keys(map).sort().reverse();
  if(!yms.length) return '<div class="rm-tnone" style="margin:12px 2px">채점 기록이 쌓이면 월별 여정이 나타나요.</div>';
  var curYm=yms[0];
  var h='<div class="rm-tl2">';
  h+=rmAheadHtml(curYm); // v2-9: 로켓 위 '앞으로(예정)'
  yms.forEach(function(ym){
    var items=map[ym]; var isCur=(ym===curYm);
    // 정렬: 선행이 여러 권이면 진도 높은 순
    items.sort(function(a,b){ return (b.m.maxP||0)-(a.m.maxP||0); });
    var L='', R='';
    items.forEach(function(it){
      var card=isCur? rmTLCur(it.bk,it.m) : rmTLPast(it.bk,it.m);
      if(it.bk.track==='복습') L+=card; else R+=card;   // v1-22: 복습만 왼쪽
    });
    h+='<div class="rm-tlrow'+(isCur?' cur':'')+'"'+(isCur?' id="rm-frontRow"':'')+'>';
    h+='<div class="rm-tlL">'+L+'</div>';
    h+='<div class="rm-tlC">'+(isCur?'<span class="rm-tlrk">🚀</span>':'')+'<span class="rm-tldot'+(isCur?' cur':'')+'"></span><span class="rm-tlm'+(isCur?' now':'')+'">'+rmYmLabel(ym)+(isCur?'<br>현재':'')+'</span></div>';
    h+='<div class="rm-tlR">'+R+'</div>';
    h+='</div>';
  });
  h+='</div>';
  return h;
}
function rmYmLabel(ym){ var mo=parseInt(ym.slice(5),10); return (isNaN(mo)?ym:mo+'월'); }
// 현재 달 카드 — 컴팩트(교재명 한 줄) + 진도바 + 탭하면 단원 노선
function rmTLCur(bk,m){
  var pr=bk.prog||{};
  var tc=rmTcOf(bk);   // v1-22
  var hasPct=(bk.pages>0&&pr.maxPage);
  var pct=hasPct?Math.min(100,Math.round(pr.maxPage/bk.pages*100)):0;
  var head=hasPct?(pct+'%'):(pr.maxPage?(pr.maxPage+'쪽'):'진행 중');
  var badge=rmBadgeOf(bk);   // v1-22
  var open=!!rmRouteOpen[bk.id];
  var h='<div class="rm-tlcur '+tc+'" onclick="rmToggleRoute(\''+esc(bk.id)+'\')">';
  h+='<div class="rm-tlpb"><span class="rm-tlbadge">'+esc(badge)+'</span><span class="rm-tlpct">'+head+'</span></div>';
  h+='<div class="rm-tlnm">'+esc(bk.name)+'</div>';
  var meta=[];
  if(pr.curChapter) meta.push('현재 '+esc(pr.curChapter));
  if(pr.lastDate) meta.push('채점 '+pr.lastDate.slice(5).replace('-','.'));
  h+='<div class="rm-tlmeta">'+(meta.length?meta.join(' · '):(pr.maxPage?pr.maxPage+'쪽 도달':'채점 대기'))+' <span style="color:#6ee7b7">🤖</span></div>';
  var ne=rmNearEnd(bk);   // v1-21: 곧 완주는 지금 하는 교재에 배지로
  if(ne) h+='<div class="rm-tlsoon">🏁 '+(ne.rem===0?'마지막 단원이에요':'곧 완주 · 남은 '+ne.rem+'단원')+'</div>';
  if(hasPct) h+='<div class="rm-tlbar"><i style="width:'+pct+'%"></i></div>';
  h+='<div class="rm-tltap">'+(open?'▲ 접기':'▼ 탭하면 단원 노선')+'</div>';
  if(open) h+='<div class="rm-route open">'+rmRouteHTML(bk)+'</div>';
  h+='</div>';
  return h;
}
function rmTLPast(bk,m){
  var tc=rmTcOf(bk);   // v1-22
  var rate=m.t?Math.round(m.c/m.t*100):0;
  var badge=rmBadgeOf(bk);   // v1-22
  var h='<div class="rm-tlpast '+tc+'" onclick="rmToggleRoute(\''+esc(bk.id)+'\')">';
  h+='<div class="rm-tlpb"><span class="rm-tlbadge">'+esc(badge)+'</span><span class="rm-tlpct">'+rate+'%</span></div>';
  h+='<div class="rm-tlnm">'+esc(bk.name)+'</div>';
  h+='<div class="rm-tlmeta">'+(m.maxP?m.maxP+'쪽 · ':'')+'정답률 '+rate+'%</div>';
  if(rmRouteOpen[bk.id]) h+='<div class="rm-route open">'+rmRouteHTML(bk)+'</div>';
  h+='</div>';
  return h;
}

window.rmToggle6yr=function(){ rm6yrOpen=!rm6yrOpen; rmRenderJourney(); };
window.rmToggleHS=function(){ rmHSopen=!rmHSopen; rmRenderJourney(); };

window.rmJumpMe=function(){
  var el=document.getElementById('rm-frontRow');

// ── v2-2: 예비 학번 · 홈 반영 · 플래너 탭 ──
function hakbeon(){
  var g=(window.studentInfo&&studentInfo.grade)||'';
  var m=String(g).match(/(초|중|고)[^0-9]*(\d)/);
  if(!m) return null;
  var lv=m[1], n=parseInt(m[2],10);
  if(!(n>=1&&n<=6)) return null;
  var d=new Date();
  var sy=(d.getMonth()+1>=3)?d.getFullYear():d.getFullYear()-1;
  var remain;
  if(lv==='초') remain=(6-n)+6;
  else if(lv==='중') remain=(3-n)+3;
  else remain=(3-n);
  if(remain<0) return null;
  var ent=(sy+remain+1)%100;
  return (ent<10?'0'+ent:''+ent);
}
function univShort(u){ return String(u||'').replace('대학교','대'); }

var rmHomeLoaded=false;
async function rmEnsureGoalMarks(){
  if(rmHomeLoaded) return;
  if(!window.sb||!window.studentInfo) return;
  var code=studentInfo.lumen_rec_code;
  try{
    var r=await sb.from('lumen_store').select('key,value').in('key',['goal_'+code,'univ_marks']);
    (r.data||[]).forEach(function(row){
      var v=row.value;
      try{ if(typeof v==='string') v=JSON.parse(v); }catch(e){}
      if(row.key==='goal_'+code) rmGoal=v||rmGoal;
      else if(row.key==='univ_marks') rmMarks=v||rmMarks;
    });
    rmHomeLoaded=true;
  }catch(e){ console.error('목표/마크 로드 실패:', e); }
}


/* ===== 학부모앱: 월별 팝업 + 토스트만 1회 주입 (여정은 탭에 인라인) ===== */
var _rmOvDone=false;

/* ===== 학부모앱: 로드맵 탭 진입 동기화 — 전체 여정을 바로 렌더 ===== */
var _rmForCode=null;
window.rmParentSync=async function(){
  rmEnsureOverlays();
  var st=(window.P&&window.P.st)||null;
  if(!st){ return; }
  window.studentInfo=st;
  if(!document.getElementById('rm-vjbody')) return; // 스켈레톤 준비 전
  var code=st.lumen_rec_code||'';
  if(_rmForCode!==code){
    // 다른 자녀로 전환 → 캐시 리셋 후 재로드
    _rmForCode=code;
    ahaCachedBooks=null; rmLoaded=false; rmHomeLoaded=false; rmHSopen=false; rm6yrOpen=false;
    rmProg={}; rmGoal=null; rmMarks={}; rmBooks=[]; rmMf={books:[],months:[],loaded:false};
    rmRenderJourney();
    try{ await rmLoad(); }catch(e){ console.warn('로드맵 로드 실패',e); }
    try{ await rmEnsureGoalMarks(); }catch(e){}
    if(((window.P&&window.P.st)||{}).lumen_rec_code!==code) return; // 그새 자녀 전환됨
    if(window.P&&window.P.tab==='roadmap'){ rmRenderJourney(); setTimeout(function(){ rmJumpMe(); },150); }
  } else {
    rmRenderJourney();
  }
};

})();

/* ── 시작 ── */
(function(){
  /* ★ v1-34: 주소에 코드가 붙어 있으면 바로 들어간다 (예: parent.html?code=ABC123)
   * 원장님이 카카오톡으로 보내는 안내 링크에 코드를 실어 두면, 학부모가 여섯 자리를
   * 옮겨 적을 필요 없이 링크 한 번으로 열린다. 한 번 열면 코드가 기기에 저장되므로
   * 다음부터는 링크 없이 주소만 열어도 된다.
   * 주소창에 코드가 남지 않도록 확인 후 지운다(가족이 옆에서 보거나 링크를 다시
   * 공유할 때 코드가 딸려 가지 않게). */
  var urlCode='';
  try{
    var m=String(location.search||'').match(/[?&]code=([A-Za-z0-9]{4,8})/);
    if(m) urlCode=m[1].toUpperCase();
    if(urlCode&&history.replaceState) history.replaceState(null,'',location.pathname+location.hash);
  }catch(e){}
  var saved=localStorage.getItem('lumen_parent_code');
  var use=urlCode||saved;
  if(use){ loadAll(use); } else { render(); }
})();
</script>
