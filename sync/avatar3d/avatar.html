<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const W=900, H=1100;
const renderer=new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true});
renderer.setSize(W,H); renderer.setPixelRatio(1); renderer.setClearColor(0x000000,0);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;

function mat(c,o){ return new THREE.MeshStandardMaterial(Object.assign({color:c, roughness:0.55, metalness:0.05},o||{})); }
function box(w,h,d,c,r,o){ const g=new RoundedBoxGeometry(w,h,d,4,r==null?0.08:r); const m=new THREE.Mesh(g,mat(c,o)); m.castShadow=true; m.receiveShadow=true; return m; }
function tex(draw,w,h){ const cv=document.createElement('canvas'); cv.width=w||512; cv.height=h||512; const cx=cv.getContext('2d'); draw(cx,cv.width,cv.height); const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t; }
function decal(w,h,t){ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshStandardMaterial({map:t, transparent:true, roughness:0.6, polygonOffset:true, polygonOffsetFactor:-2})); return m; }

/* 얼굴 표정: 기본 smile · 칭찬 happy · 걱정 worried */
function faceTex(mode, skinDark){
  return tex((c,w,h)=>{ c.clearRect(0,0,w,h); c.fillStyle='#1b1f27'; c.strokeStyle='#1b1f27'; c.lineCap='round';
    const ex=[w*0.34,w*0.66], ey=h*0.44;
    if(mode==='happy'){ c.lineWidth=22; ex.forEach(x=>{ c.beginPath(); c.arc(x,ey+10,34,Math.PI*1.15,Math.PI*1.85); c.stroke(); }); }
    else { ex.forEach(x=>{ c.beginPath(); c.ellipse(x,ey,22,40,0,0,Math.PI*2); c.fill(); }); c.fillStyle='#fff'; ex.forEach(x=>{ c.beginPath(); c.ellipse(x-7,ey-14,7,11,0,0,Math.PI*2); c.fill(); }); c.fillStyle='#1b1f27'; }
    if(mode==='worried'){ c.lineWidth=16; c.beginPath(); c.moveTo(ex[0]-34,ey-70); c.lineTo(ex[0]+30,ey-56); c.stroke(); c.beginPath(); c.moveTo(ex[1]+34,ey-70); c.lineTo(ex[1]-30,ey-56); c.stroke(); }
    c.lineWidth=18; c.beginPath();
    if(mode==='happy'){ c.moveTo(w*0.33,h*0.66); c.quadraticCurveTo(w*0.5,h*0.9,w*0.67,h*0.66); c.stroke(); c.fillStyle='#b3261e'; c.beginPath(); c.moveTo(w*0.37,h*0.7); c.quadraticCurveTo(w*0.5,h*0.86,w*0.63,h*0.7); c.closePath(); c.fill(); }
    else if(mode==='worried'){ c.moveTo(w*0.38,h*0.74); c.quadraticCurveTo(w*0.5,h*0.68,w*0.62,h*0.74); c.stroke(); }
    else { c.moveTo(w*0.35,h*0.66); c.quadraticCurveTo(w*0.5,h*0.82,w*0.65,h*0.66); c.stroke(); }
    if(mode!=='worried'){ c.fillStyle='rgba(224,70,60,.35)'; [w*0.2,w*0.8].forEach(x=>{ c.beginPath(); c.ellipse(x,h*0.6,34,20,0,0,Math.PI*2); c.fill(); }); }
  });
}

function build(cfg){
  const g=new THREE.Group();
  const SK=cfg.skin||'#f2c49a';
  /* 몸통·팔·다리 (R6 비율: 머리 1.2 · 몸 2×2×1 · 팔다리 1×2×1) */
  const torso=box(2,2,1,cfg.top||'#e0463c',0.1); torso.position.y=3; g.add(torso);
  const legL=box(0.95,2,0.95,cfg.leg||SK,0.1); legL.position.set(-0.5,1,0); g.add(legL);
  const legR=legL.clone(); legR.position.x=0.5; g.add(legR);
  if(cfg.shorts){ const s=box(2.06,0.8,1.06,cfg.shorts,0.1); s.position.y=1.65; g.add(s); }
  if(cfg.sock){ [legL,legR].forEach(l=>{ const s=box(0.99,0.7,0.99,cfg.sock,0.08); s.position.set(l.position.x,0.55,0); g.add(s); }); }
  [-1,1].forEach(sx=>{ const sh=box(1.05,0.45,1.1,cfg.shoe||'#1b1f27',0.12); sh.position.set(sx*0.5,0.22,0.06); g.add(sh); });
  const armMat=cfg.sleeve||SK;
  [-1,1].forEach(sx=>{ const piv=new THREE.Group(); piv.position.set(sx*1.5,3.9,0); const a=box(0.95,2,0.95,armMat,0.1); a.position.y=-0.95; piv.add(a);
    if(cfg.sleeveTop){ const st=box(1.0,0.75,1.0,cfg.sleeveTop,0.08); st.position.y=-0.35; piv.add(st); }
    if(!cfg.sleeve){ const hand=box(0.95,0.5,0.95,SK,0.1); hand.position.y=-1.7; piv.add(hand); }
    piv.rotation.z=sx*-0.12; piv.rotation.x=(cfg.armFwd||[0,0])[sx>0?1:0]; piv.name=sx>0?'armR':'armL'; g.add(piv); });
  /* 머리 */
  const head=box(1.25,1.25,1.25,SK,0.16); head.position.y=4.7; g.add(head);
  const face=decal(1.1,1.1,faceTex(cfg.mode||'smile')); face.position.set(0,4.66,0.63); g.add(face);
  /* 머리카락 */
  const HC=cfg.hairC||'#3b2a1e';
  if(cfg.hair==='short'){ const h=box(1.33,0.42,1.33,HC,0.14); h.position.y=5.2; g.add(h); const fr=box(1.33,0.32,0.32,HC,0.1); fr.position.set(0,4.96,0.52); g.add(fr); const sd=box(0.3,0.5,1.2,HC,0.1); sd.position.set(-0.53,4.85,-0.05); g.add(sd); }
  if(cfg.hair==='long'){ const h=box(1.36,0.46,1.36,HC,0.14); h.position.y=5.18; g.add(h); const fr=box(1.36,0.34,0.34,HC,0.1); fr.position.set(0,4.98,0.53); g.add(fr); [-1,1].forEach(sx=>{ const s=box(0.3,1.2,1.1,HC,0.1); s.position.set(sx*0.55,4.45,-0.1); g.add(s); }); const bk=box(1.2,1.3,0.3,HC,0.1); bk.position.set(0,4.45,-0.55); g.add(bk); }
  if(cfg.hair==='bun'){ const h=box(1.34,0.44,1.34,HC,0.14); h.position.y=5.19; g.add(h); const fr=box(1.34,0.3,0.3,HC,0.1); fr.position.set(0,4.98,0.53); g.add(fr); const b=new THREE.Mesh(new THREE.SphereGeometry(0.34,24,24),mat(HC)); b.position.set(0,5.55,-0.3); b.castShadow=true; g.add(b); }
  if(cfg.hood){ /* 내려 쓴 후드: 목 뒤에 두툼하게 */ const hd=box(1.7,0.75,0.9,cfg.hood,0.3); hd.position.set(0,4.05,-0.62); hd.rotation.x=-0.35; g.add(hd); }
  if(cfg.hat){ /* 길드 코디 뾰족 모자 + 챙 + 금띠 */ const cone=new THREE.Mesh(new THREE.ConeGeometry(0.85,1.5,40),mat(cfg.hat)); cone.position.set(0,5.95,-0.05); cone.rotation.z=-0.12; cone.castShadow=true; g.add(cone); const brim=new THREE.Mesh(new THREE.CylinderGeometry(1.25,1.25,0.12,48),mat(cfg.hat)); brim.position.set(0,5.25,0); brim.castShadow=true; g.add(brim); const band=new THREE.Mesh(new THREE.CylinderGeometry(0.74,0.8,0.22,40),mat('#c58a12',{metalness:0.5,roughness:0.35})); band.position.set(0,5.4,0); g.add(band); }
  if(cfg.glasses){ const r=new THREE.TorusGeometry(0.2,0.035,10,32); [-0.28,0.28].forEach(x=>{ const t=new THREE.Mesh(r,mat('#1b1f27',{metalness:0.4,roughness:0.3})); t.position.set(x,4.72,0.66); g.add(t); }); const br=box(0.16,0.05,0.05,'#1b1f27',0.02); br.position.set(0,4.72,0.66); g.add(br); }
  if(cfg.headset){ const ring=new THREE.Mesh(new THREE.TorusGeometry(0.72,0.07,12,40,Math.PI),mat('#111827',{roughness:0.35})); ring.position.set(0,4.72,0); g.add(ring); [-1,1].forEach(sx=>{ const cup=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.28,0.18,32),mat('#111827',{roughness:0.35})); cup.rotation.z=Math.PI/2; cup.position.set(sx*0.72,4.66,0); g.add(cup); const led=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.02,32),mat(cfg.led||'#22d3ee',{emissive:cfg.led||'#22d3ee',emissiveIntensity:1.2})); led.rotation.z=Math.PI/2; led.position.set(sx*0.82,4.66,0); g.add(led); }); const mic=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.8,8),mat('#111827')); mic.position.set(-0.55,4.35,0.5); mic.rotation.z=0.6; mic.rotation.x=-0.5; g.add(mic); }
  /* 옷 장식 */
  if(cfg.number){ const t=tex((c,w,h)=>{ c.clearRect(0,0,w,h); c.fillStyle='#fff'; c.font='900 300px "Noto Sans KR", Arial, sans-serif'; c.textAlign='center'; c.textBaseline='middle'; c.fillText(cfg.number,w/2,h/2+10); },512,512); const d=decal(1.4,1.4,t); d.position.set(0,2.95,0.52); g.add(d); }
  if(cfg.stripes){ [-0.85,0.85].forEach(x=>{ const s=box(0.16,2.02,1.02,cfg.stripes,0.04); s.position.set(x,3,0); g.add(s); }); const col=tex((c,w,h)=>{ c.clearRect(0,0,w,h); c.fillStyle=cfg.stripes; c.beginPath(); c.moveTo(w*0.3,0); c.lineTo(w*0.5,h*0.5); c.lineTo(w*0.7,0); c.closePath(); c.fill(); },256,256); const cd=decal(1.2,0.5,col); cd.position.set(0,3.75,0.52); g.add(cd); }
  if(cfg.coat){ const c1=box(2.2,2.1,1.15,cfg.coat,0.1); c1.position.set(0,2.95,-0.03); g.add(c1); const lap=tex((c,w,h)=>{ c.clearRect(0,0,w,h); c.fillStyle=cfg.shirt||'#60a5fa'; c.beginPath(); c.moveTo(w*0.36,0); c.lineTo(w*0.5,h*0.55); c.lineTo(w*0.64,0); c.closePath(); c.fill(); c.strokeStyle='rgba(0,0,0,.12)'; c.lineWidth=10; c.beginPath(); c.moveTo(w*0.5,h*0.55); c.lineTo(w*0.5,h); c.stroke(); c.fillStyle='#e0463c'; c.beginPath(); c.arc(w*0.72,h*0.25,22,0,Math.PI*2); c.fill(); c.fillStyle='#fff'; c.fillRect(w*0.72-4,h*0.25-14,8,28); c.fillRect(w*0.72-14,h*0.25-4,28,8); },512,512); const d=decal(2.1,2.0,lap); d.position.set(0,2.95,0.58); g.add(d); }
  if(cfg.stetho){ const tube=new THREE.Mesh(new THREE.TorusGeometry(0.62,0.045,10,48,Math.PI*1.1),mat('#1f2937',{roughness:0.4})); tube.position.set(0,4.05,0.2); tube.rotation.x=0.5; tube.rotation.z=Math.PI*0.95; g.add(tube); const bell=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,0.08,32),mat('#cbd5e1',{metalness:0.8,roughness:0.25})); bell.position.set(0.62,3.2,0.58); bell.rotation.x=Math.PI/2; g.add(bell); const line=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,1.0,8),mat('#1f2937')); line.position.set(0.6,3.65,0.5); line.rotation.z=0.06; g.add(line); }
  if(cfg.belt){ const b=box(2.08,0.3,1.08,cfg.belt,0.05); b.position.y=2.15; g.add(b); const bk=box(0.4,0.34,0.1,'#fde68a',0.04); bk.position.set(0,2.15,0.55); g.add(bk); }
  if(cfg.robe){ const r=box(2.15,1.3,1.12,cfg.robe,0.1); r.position.y=1.5; g.add(r); }
  if(cfg.hoodie){ const kang=box(1.5,0.5,0.16,cfg.top,0.06); kang.position.set(0,2.3,0.55); g.add(kang); const str=tex((c,w,h)=>{ c.clearRect(0,0,w,h); c.strokeStyle='#e5e7eb'; c.lineWidth=14; c.lineCap='round'; [w*0.42,w*0.58].forEach(x=>{ c.beginPath(); c.moveTo(x,0); c.lineTo(x,h*0.45); c.stroke(); }); c.fillStyle='#e5e7eb'; c.font='900 120px Arial'; c.textAlign='center'; c.fillText('GG',w/2,h*0.86); },512,512); const d=decal(1.6,1.6,str); d.position.set(0,3.1,0.52); g.add(d); }
  /* 소품 */
  if(cfg.prop==='ball'){ const bt=tex((c,w,h)=>{ c.fillStyle='#f8fafc'; c.fillRect(0,0,w,h); c.fillStyle='#1b1f27'; const pent=(x,y,r)=>{ c.beginPath(); for(let i=0;i<5;i++){ const a=-Math.PI/2+i*Math.PI*2/5; c.lineTo(x+r*Math.cos(a),y+r*Math.sin(a)); } c.closePath(); c.fill(); }; [[0.25,0.3],[0.75,0.3],[0.5,0.62],[0.05,0.75],[0.95,0.75],[0.5,0.05],[0.5,0.98]].forEach(p=>pent(p[0]*w,p[1]*h,w*0.09)); },512,512); const ball=new THREE.Mesh(new THREE.SphereGeometry(0.55,48,48),new THREE.MeshStandardMaterial({map:bt,roughness:0.5})); ball.position.set(1.7,0.55,0.6); ball.rotation.y=0.6; ball.castShadow=true; g.add(ball); }
  if(cfg.prop==='scroll'){ const sc=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,1.1,32),mat('#fde68a')); sc.position.set(-1.85,2.05,0.7); sc.rotation.z=0.25; sc.castShadow=true; g.add(sc); [-0.6,0.6].forEach(y=>{ const cap=new THREE.Mesh(new THREE.CylinderGeometry(0.27,0.27,0.12,32),mat('#c58a12',{metalness:0.5,roughness:0.3})); cap.position.set(-1.85-Math.sin(0.25)*y,2.05+Math.cos(0.25)*y,0.7); cap.rotation.z=0.25; g.add(cap); }); }
  if(cfg.prop==='sword'){ const bl=box(0.14,2.2,0.05,'#e5e7eb',0.02,{metalness:0.85,roughness:0.2}); bl.position.set(1.95,2.9,0.75); g.add(bl); const gd=box(0.7,0.14,0.14,'#c58a12',0.03,{metalness:0.6,roughness:0.3}); gd.position.set(1.95,1.75,0.75); g.add(gd); const hd=box(0.16,0.5,0.16,'#3b2a1e',0.04); hd.position.set(1.95,1.45,0.75); g.add(hd); }
  if(cfg.badge){ const bt=tex((c,w,h)=>{ c.clearRect(0,0,w,h); c.fillStyle='#0d2240'; c.beginPath(); c.arc(w/2,h/2,w*0.46,0,Math.PI*2); c.fill(); c.strokeStyle='#fde68a'; c.lineWidth=18; c.stroke(); c.fillStyle='#fde68a'; c.font='900 150px "Noto Sans KR", Arial'; c.textAlign='center'; c.textBaseline='middle'; c.fillText(cfg.badge,w/2,h/2+8); },512,512); const d=decal(0.7,0.7,bt); d.position.set(-0.6,3.55,0.53); g.add(d); }
  return g;
}

function buildGolem(){
  const g=new THREE.Group(); const stone=(w,h,d,c)=>box(w,h,d,c||'#8b95a5',0.12,{roughness:0.9});
  const body=stone(3.2,3.2,2.2); body.position.y=3.2; g.add(body);
  const crack=tex((c,w,h)=>{ c.clearRect(0,0,w,h); c.strokeStyle='rgba(30,41,59,.9)'; c.lineWidth=14; c.lineCap='round'; c.beginPath(); c.moveTo(w*0.2,h*0.15); c.lineTo(w*0.33,h*0.4); c.lineTo(w*0.25,h*0.6); c.moveTo(w*0.7,h*0.1); c.lineTo(w*0.62,h*0.35); c.lineTo(w*0.78,h*0.55); c.lineTo(w*0.7,h*0.8); c.stroke(); },512,512); const cd=decal(3.0,3.0,crack); cd.position.set(0,3.2,1.12); g.add(cd);
  const core=box(0.9,0.9,0.3,'#fde68a',0.1,{emissive:'#f59e0b',emissiveIntensity:0.9}); core.position.set(0,3.0,1.05); g.add(core);
  [-1,1].forEach(sx=>{ const a=stone(1.1,3.0,1.1,'#6b7280'); a.position.set(sx*2.35,2.6,0); a.rotation.z=sx*0.12; g.add(a); const f=stone(1.3,0.9,1.3,'#4b5563'); f.position.set(sx*2.5,1.0,0.1); g.add(f); });
  [-1,1].forEach(sx=>{ const l=stone(1.2,1.5,1.3,'#4b5563'); l.position.set(sx*0.85,0.75,0); g.add(l); });
  const head=stone(2.0,1.9,1.9,'#9aa3b2'); head.position.y=5.7; g.add(head);
  [-1,1].forEach(sx=>{ const e=box(0.42,0.26,0.1,'#7dd3fc',0.04,{emissive:'#38bdf8',emissiveIntensity:1.6}); e.position.set(sx*0.45,5.85,0.97); g.add(e); });
  const mouth=box(0.9,0.12,0.1,'#374151',0.03); mouth.position.set(0,5.2,0.97); g.add(mouth);
  const moss=box(2.1,0.25,2.0,'#6b8e5a',0.1,{roughness:1}); moss.position.set(0,6.7,0); g.add(moss);
  [[-0.7,6.9,0.5],[0.6,6.95,-0.4],[1.9,4.95,0.3]].forEach(p=>{ const m=new THREE.Mesh(new THREE.SphereGeometry(0.22,16,16),mat('#9bbf85',{roughness:1})); m.position.set(...p); g.add(m); });
  return g;
}

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(28, W/H, 0.1, 100);
const hemi=new THREE.HemisphereLight(0xffffff,0x6b7a90,0.9); scene.add(hemi);
const key=new THREE.DirectionalLight(0xfff4e0,2.2); key.position.set(4,9,6); key.castShadow=true; key.shadow.mapSize.set(2048,2048); key.shadow.camera.left=-6; key.shadow.camera.right=6; key.shadow.camera.top=9; key.shadow.camera.bottom=-2; key.shadow.bias=-0.0006; key.shadow.radius=4; scene.add(key);
const fill=new THREE.DirectionalLight(0xcfe0ff,0.7); fill.position.set(-6,4,3); scene.add(fill);
const rim=new THREE.DirectionalLight(0xffffff,0.8); rim.position.set(-2,6,-6); scene.add(rim);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,40), new THREE.ShadowMaterial({opacity:0.28})); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
let cur=null;
window.render=function(cfg){
  if(cur) scene.remove(cur);
  cur=cfg.golem?buildGolem():build(cfg); cur.rotation.y=cfg.yaw==null?-0.45:cfg.yaw; scene.add(cur);
  const top=cfg.golem?7.2:5.9; const cy=top*0.5;
  camera.position.set(cfg.golem?7.5:6.2, cfg.golem?6.6:5.2, cfg.golem?13.5:11.2); camera.lookAt(0,cy,0);
  renderer.render(scene,camera);
  return renderer.domElement.toDataURL('image/png');
};
window.ready=true;
</script>
