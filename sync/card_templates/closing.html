<div class="card dark">
  <div class="kicker">{{kicker}}</div>
  <div class="rule"></div>
  <div class="grow">
    <h1 class="fit" style="font-size:72px;max-height:640px">{{line}}</h1>
    <p class="muted fit" style="margin-top:56px;font-size:36px;max-height:180px">{{sub}}</p>
  </div>
  <div style="display:flex;align-items:center;gap:22px;margin-top:40px">
    <div style="width:14px;height:64px;background:var(--gold);border-radius:7px"></div>
    <div><div style="font-size:44px;font-weight:800">{{name}}</div><div style="font-size:30px;color:#b7c3d6;margin-top:6px">{{cta}}</div></div>
  </div>
  <div class="footer"><div class="brand"><span class="dot"></span>루멘수학 · 부천 옥길동</div><div class="page">{{page}}</div></div>
</div>
