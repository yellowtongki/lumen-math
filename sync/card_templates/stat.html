<div class="card">
  <div class="kicker">{{label}}</div>
  <div class="rule"></div>
  <div class="grow" style="align-items:flex-start">
    <div style="display:flex;align-items:baseline;gap:20px">
      <div class="fit" style="font-size:300px;font-weight:800;line-height:1;letter-spacing:-.05em;color:var(--navy);max-height:320px">{{big}}</div>
      <div style="font-size:72px;font-weight:700;color:var(--gold)">{{unit}}</div>
    </div>
    <p class="fit" style="margin-top:56px;font-size:44px;font-weight:600;max-height:400px">{{desc}}</p>
  </div>
  <div class="footer"><div class="brand"><span class="dot"></span>루멘수학 · 부천 옥길동</div><div class="page">{{page}}</div></div>
</div>
