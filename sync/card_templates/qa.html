<div class="card">
  <div class="kicker">질문</div>
  <div class="rule"></div>
  <h2 class="fit" style="max-height:330px">"{{q}}"</h2>
  <div class="grow">
    <div style="border-left:12px solid var(--gold);padding-left:40px">
      <div style="font-size:30px;font-weight:700;color:var(--gold);margin-bottom:18px">루멘수학의 답</div>
      <p class="fit" style="font-size:46px;font-weight:700;line-height:1.4;max-height:420px">{{a}}</p>
    </div>
    <p class="muted fit" style="margin-top:40px;font-size:34px;max-height:180px">{{note}}</p>
  </div>
  <div class="footer"><div class="brand"><span class="dot"></span>루멘수학 · 부천 옥길동</div><div class="page">{{page}}</div></div>
</div>
