<div class="card photo" style="--bg-img:url('{{bgUrl}}')">
  <div class="scrim"></div>
  <div class="on">
    <div class="kicker">{{kicker}}</div>
    <div class="rule"></div>
    <div class="grow">
      <h1 class="fit hl" style="max-height:640px">{{{headlineHtml}}}</h1>
      <p class="fit" style="margin-top:44px;font-size:40px;font-weight:600;max-height:240px;color:#dbe6f6">{{sub}}</p>
    </div>
    <div class="footer"><div class="brand"><span class="dot"></span>루멘수학 · 부천 옥길동</div><div class="page">{{page}}</div></div>
  </div>
</div>
