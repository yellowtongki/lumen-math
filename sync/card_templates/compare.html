<div class="card">
  <div class="kicker">비교</div>
  <div class="rule"></div>
  <h2 class="fit" style="max-height:200px">{{title}}</h2>
  <div class="grow" style="flex-direction:row;gap:28px;margin-top:44px;justify-content:flex-start;align-items:flex-start">
    <div style="flex:1;background:var(--white);border:3px solid var(--line);border-radius:28px;padding:40px 36px;display:flex;flex-direction:column">
      <div style="font-size:38px;font-weight:800;color:var(--navy);padding-bottom:20px;border-bottom:4px solid var(--navy);margin-bottom:24px">{{leftTitle}}</div>
      <ul class="fit" style="list-style:none;font-size:36px;line-height:1.5">{{{leftItemsHtml}}}</ul>
    </div>
    <div style="flex:1;background:var(--navy);color:var(--white);border-radius:28px;padding:40px 36px;display:flex;flex-direction:column">
      <div style="font-size:38px;font-weight:800;color:#f2d28f;padding-bottom:20px;border-bottom:4px solid var(--gold);margin-bottom:24px">{{rightTitle}}</div>
      <ul class="fit" style="list-style:none;font-size:36px;line-height:1.5">{{{rightItemsHtml}}}</ul>
    </div>
  </div>
  <p class="muted fit" style="margin-top:56px;font-size:40px;font-weight:600;max-height:220px">{{note}}</p>
  <div class="footer"><div class="brand"><span class="dot"></span>루멘수학 · 부천 옥길동</div><div class="page">{{page}}</div></div>
</div>
