<!doctype html><html><head><meta charset="utf-8">
<style>
/*FONTS*/
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b0809}
body{font-family:'Pretendard',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:0;background:
  radial-gradient(1200px 820px at 50% -8%, rgba(253,193,8,.17), transparent 62%),
  radial-gradient(900px 700px at 12% 108%, rgba(192,63,63,.20), transparent 60%),
  linear-gradient(180deg,#14100f 0%,#0b0809 55%,#120d0d 100%)}
.grain{position:absolute;inset:-50%;opacity:.055;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence baseFrequency='.85' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>")}
.vig{position:absolute;inset:0;background:radial-gradient(130% 80% at 50% 45%, transparent 55%, rgba(0,0,0,.62) 100%)}
.spark{position:absolute;width:7px;height:7px;border-radius:50%;background:#fdc108;filter:blur(.4px)}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 90px}
.kick{font-weight:700;font-size:38px;letter-spacing:.10em;color:#fdc108;margin-bottom:34px}
.big{font-weight:800;font-size:300px;line-height:.92;letter-spacing:-.045em;
  background:linear-gradient(180deg,#fff7df 0%,#fdc108 52%,#c98f06 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 18px 44px rgba(253,193,8,.26))}
.unit{font-weight:800;font-size:92px;color:#fff;opacity:.92;margin-left:10px}
.row{display:flex;align-items:baseline}
.sub{font-weight:600;font-size:46px;color:rgba(255,255,255,.72);margin-top:30px;text-align:center;line-height:1.45}
.badge{margin-top:46px;font-weight:800;font-size:60px;color:#0b0809;background:#fdc108;
  padding:16px 44px;border-radius:999px;box-shadow:0 18px 46px rgba(253,193,8,.34)}
.line{font-weight:800;font-size:78px;line-height:1.34;letter-spacing:-.025em;text-align:center}
.line .hl{color:#fdc108;position:relative;white-space:nowrap}
.line .hl u{position:absolute;left:0;bottom:-14px;height:9px;background:#fdc108;border-radius:5px;display:block}
.chip{font-weight:700;font-size:44px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.16);
  padding:22px 40px;border-radius:24px;white-space:nowrap}
.bar{width:720px;height:12px;border-radius:6px;background:rgba(255,255,255,.12);margin:54px 0;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#c03f3f,#fdc108);border-radius:6px}
.item{font-weight:700;font-size:40px;color:rgba(255,255,255,.80);text-align:center;line-height:1.5;margin-top:18px}
.fx{position:relative;display:inline-block;overflow:hidden;margin-top:14px}
.fxglow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1000px;height:420px;background:radial-gradient(ellipse at center,rgba(253,193,8,.20),transparent 65%);pointer-events:none}
.fx svg{display:block}
.cap{font-weight:700;font-size:52px;color:rgba(255,255,255,.86);text-align:center;line-height:1.45;margin-top:70px}
.logo{height:118px;opacity:.96}
.name{font-weight:800;font-size:56px;letter-spacing:-.02em;margin-top:26px}
.where{font-weight:600;font-size:40px;color:rgba(255,255,255,.6);margin-top:12px}
.sweep{position:absolute;left:0;right:0;height:5px;background:linear-gradient(90deg,transparent,#fdc108,transparent)}
.prog{position:absolute;bottom:92px;left:90px;right:90px;height:6px;background:rgba(255,255,255,.12);border-radius:3px}
.prog i{display:block;height:100%;background:#fdc108;border-radius:3px}
.mark{position:absolute;bottom:40px;left:0;right:0;text-align:center;font-weight:600;font-size:28px;color:rgba(255,255,255,.42)}
</style></head><body>
<div id="stage">
  <div class="bg"></div><div class="grain" id="grain"></div>
  <div id="sparks"></div>
  <div id="scenes"></div>
  <div class="vig"></div>
  <div class="prog"><i id="pg"></i></div>
  <div class="mark">루멘수학 · 부천 옥길동</div>
</div>
<script src="/*MATHJAX*/"></script>
<script>
const R = /*REEL*/;
const FPS = R.fps || 30;
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const eOut=t=>1-Math.pow(1-cl(t,0,1),3);
const eIn =t=>Math.pow(cl(t,0,1),3);
const eBack=t=>{t=cl(t,0,1);const c=1.70158+1;return 1+ (c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const lerp=(a,b,t)=>a+(b-a)*cl(t,0,1);
// 장면 시작 시각 계산
let acc=0; R.scenes.forEach(s=>{s._a=acc; s._b=acc+s.sec; acc+=s.sec});
R.total=acc;

// 반짝이 — 한 번만 자리를 정해 둔다 (매 장면 같은 자리여야 깜빡이지 않는다)
let seed=20261025; const rnd=()=>(seed=(seed*1103515245+12345)&0x7fffffff)/0x7fffffff;
const SP=[...Array(26)].map(()=>({x:rnd()*1080,y:rnd()*1920,d:rnd()*6+3,p:rnd()*6.28,s:rnd()*.8+.5}));
const sparkEl=SP.map(s=>{const e=document.createElement('div');e.className='spark';
  e.style.width=e.style.height=(4+s.s*6)+'px';document.getElementById('sparks').appendChild(e);return e});

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function html(s){
  if(s.type==='hook') return `<div class="kick">${esc(s.kicker)}</div>
    <div class="row"><div class="big" data-num>0</div><div class="unit">${esc(s.unit||'')}</div></div>
    <div class="sub">${esc(s.sub||'').replace(/\n/g,'<br>')}</div>
    <div class="badge">${esc(s.badge||'')}</div>`;
  if(s.type==='timeline') return `<div class="kick">${esc(s.kicker||'')}</div>
    <div class="chip" data-i="0">${esc(s.from)}</div>
    <div class="bar"><i></i></div>
    <div class="chip" data-i="1">${esc(s.to)}</div>
    <div class="row" style="margin-top:56px"><div class="big" style="font-size:210px" data-num>0</div><div class="unit">${esc(s.unit||'')}</div></div>`;
  if(s.type==='lines') return s.lines.map((l,i)=>
    `<div class="line" data-i="${i}" style="margin-top:${i?44:0}px">${l.replace(/\*(.+?)\*/g,'<span class="hl">$1<u style="width:0"></u></span>')}</div>`).join('');
  if(s.type==='count') return `<div class="kick">${esc(s.kicker||'')}</div>
    <div class="row"><div class="big" data-num>0</div><div class="unit">${esc(s.unit||'')}</div></div>
    <div class="sub" style="margin-top:18px">${esc(s.sub||'')}</div>
    <div style="margin-top:54px">${(s.items||[]).map((x,i)=>`<div class="item" data-i="${i}">${esc(x)}</div>`).join('')}</div>`;
  if(s.type==='formula') return `<div class="kick">${esc(s.kicker||'')}</div>
    <div class="fxglow"></div><div class="fx" data-fx>${s._svg||''}</div>
    <div class="cap">${esc(s.cap||'').replace(/\n/g,'<br>')}</div>`;
  if(s.type==='close') return `<div class="row"><div class="big" style="font-size:190px" data-num2>${esc(s.from)}</div>
      <div class="unit" style="opacity:.5;margin:0 26px">→</div>
      <div class="big" style="font-size:190px">${esc(s.to)}</div></div>
    <div class="line" style="margin-top:56px;font-size:66px">${esc(s.line||'').replace(/\n/g,'<br>')}</div>
    <img class="logo" style="margin-top:70px" src="/*LOGO*/">
    <div class="where">${esc(s.where||'부천 옥길동')}</div>`;
  return '';
}
const host=document.getElementById('scenes');
R.scenes.forEach((s,i)=>{const d=document.createElement('div');d.className='scene';d.dataset.s=i;d.innerHTML=html(s);host.appendChild(d)});
const nodes=[...host.children];

function render(T){
  document.getElementById('pg').style.width=(T/R.total*100)+'%';
  document.getElementById('grain').style.transform=`translate(${(T*37)%60-30}px,${(T*23)%60-30}px)`;
  sparkEl.forEach((e,i)=>{const s=SP[i];const y=(s.y - T*s.d*9)%2060; 
    e.style.transform=`translate(${s.x}px,${(y+2060)%2060-70}px)`;
    e.style.opacity=(.18+.32*(0.5+0.5*Math.sin(T*1.6+s.p))).toFixed(3)});

  R.scenes.forEach((s,i)=>{
    const el=nodes[i], t=T-s._a, p=t/s.sec;
    if(t<-.45||t>s.sec+.45){el.style.opacity=0;el.style.visibility='hidden';return}
    el.style.visibility='visible';
    // 장면 들어오고 나가기
    const inA=eOut(t/.52), outA=1-eIn((t-(s.sec-.45))/.45);
    el.style.opacity=cl(Math.min(inA,outA),0,1).toFixed(3);
    el.style.transform=`translateY(${lerp(46,0,eOut(t/.6))-lerp(0,30,eIn((t-(s.sec-.45))/.45))}px) scale(${lerp(.965,1,eOut(t/.7))})`;

    const num=el.querySelector('[data-num]');
    if(num){ const d=s.delay||.45, dur=s.dur||1.15;
      const k=eOut((t-d)/dur); const v=Math.round(lerp(s.from0!==undefined?s.from0:0,s.num,k));
      num.textContent = t<d ? (s.from0!==undefined?s.from0:0) : v; }
    if(s.type==='hook'){
      const b=el.querySelector('.badge'); const bt=(t-((s.delay||.45)+(s.dur||1.15)+.12))/.5;
      b.style.opacity=cl(eOut(bt),0,1); b.style.transform=`scale(${lerp(.6,1,eBack(bt))})`;
      const sb=el.querySelector('.sub'); sb.style.opacity=cl(eOut((t-.35)/.5),0,1);
    }
    if(s.type==='timeline'){
      el.querySelectorAll('.chip').forEach((c,j)=>{const k=eOut((t-(.3+j*.45))/.5);
        c.style.opacity=cl(k,0,1); c.style.transform=`translateX(${lerp(j?80:-80,0,k)}px)`});
      el.querySelector('.bar i').style.width=(cl(eOut((t-.55)/1.1),0,1)*100)+'%';
    }
    if(s.type==='lines'){
      el.querySelectorAll('.line').forEach((L,j)=>{const k=eOut((t-(.22+j*.62))/.55);
        L.style.opacity=cl(k,0,1); L.style.transform=`translateY(${lerp(26,0,k)}px)`;
        const u=L.querySelector('.hl u'); if(u){const w=cl(eOut((t-(.22+j*.62)-.34)/.52),0,1);
          u.style.width=(w*100)+'%'}});
    }
    if(s.type==='count'){
      el.querySelectorAll('.item').forEach((L,j)=>{const k=eOut((t-(1.35+j*.33))/.45);
        L.style.opacity=cl(k,0,1)*.95; L.style.transform=`translateY(${lerp(18,0,k)}px)`});
    }
    if(s.type==='formula'){
      const fx=el.querySelector('[data-fx]'); if(fx){
        const k=cl(eOut((t-.42)/1.5),0,1);
        fx.style.clipPath=`inset(0 ${(1-k)*100}% 0 0)`;
      }
      const c=el.querySelector('.cap'); c.style.opacity=cl(eOut((t-1.75)/.6),0,1);
    }
    if(s.type==='close'){
      const lg=el.querySelector('.logo'), k=eOut((t-.75)/.7);
      lg.style.opacity=cl(k,0,1); lg.style.transform=`scale(${lerp(.86,1,eBack(k))})`;
      el.querySelector('.where').style.opacity=cl(eOut((t-1.05)/.6),0,1);
    }
  });
}
window.__render=render;
window.__ready=true;
</script></body></html>
