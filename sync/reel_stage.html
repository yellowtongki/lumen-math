<!doctype html><html><head><meta charset="utf-8">
<style>
/*FONTS*/
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b0809}
body{font-family:'Pretendard',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:0;background:
  radial-gradient(1250px 860px at 50% -6%, rgba(253,193,8,.20), transparent 62%),
  radial-gradient(900px 700px at 10% 106%, rgba(192,63,63,.22), transparent 60%),
  linear-gradient(180deg,#14100f 0%,#0b0809 55%,#120d0d 100%)}
.grain{position:absolute;inset:-50%;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence baseFrequency='.85' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>")}
.vig{position:absolute;inset:0;background:radial-gradient(130% 78% at 50% 42%, transparent 54%, rgba(0,0,0,.66) 100%)}
.flash{position:absolute;inset:0;background:#fdc108;opacity:0;mix-blend-mode:screen}
.spark{position:absolute;border-radius:50%;background:#fdc108;filter:blur(.4px)}
/* 인스타 릴스는 아래쪽을 버튼·설명이 덮는다 → 글은 가운데(위 300 ~ 아래 1540)에만 둔다 */
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:300px 70px 380px;text-align:center}
.kick{font-weight:800;font-size:54px;letter-spacing:.06em;color:#fdc108;margin-bottom:34px}
.big{font-weight:800;font-size:430px;line-height:.88;letter-spacing:-.05em;
  background:linear-gradient(180deg,#fffbee 0%,#fdc108 50%,#d39a07 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 20px 60px rgba(253,193,8,.34))}
.unit{font-weight:800;font-size:140px;color:#fff;margin-left:14px;opacity:.95}
.row{display:flex;align-items:baseline;justify-content:center}
.sub{font-weight:700;font-size:62px;color:rgba(255,255,255,.80);margin-top:34px;line-height:1.4}
.badge{margin-top:48px;font-weight:800;font-size:88px;color:#120d0d;background:#fdc108;
  padding:20px 58px;border-radius:999px;box-shadow:0 22px 60px rgba(253,193,8,.42)}
.line{font-weight:800;font-size:112px;line-height:1.26;letter-spacing:-.035em}
.line.sm{font-size:88px}
.line .hl{color:#fdc108;position:relative;white-space:nowrap}
.line .hl u{position:absolute;left:0;bottom:-18px;height:14px;background:#fdc108;border-radius:7px;display:block}
.chip{font-weight:800;font-size:58px;background:rgba(255,255,255,.08);border:3px solid rgba(255,255,255,.18);
  padding:24px 44px;border-radius:26px;margin-top:26px;line-height:1.3}
.fx{position:relative;display:inline-block;overflow:hidden;margin-top:20px}
.fxglow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1050px;height:460px;
  background:radial-gradient(ellipse at center,rgba(253,193,8,.22),transparent 65%);pointer-events:none}
.fx svg{display:block}
.cap{font-weight:800;font-size:72px;color:#fff;line-height:1.34;margin-top:72px;letter-spacing:-.03em}
/* 금색 바탕 한 방 */
.punch{background:linear-gradient(165deg,#ffd43c 0%,#fdc108 48%,#e0a606 100%);color:#140f0a}
.punch .kick{color:rgba(20,15,10,.62)}
.punch .big{background:none;-webkit-background-clip:initial;background-clip:initial;color:#140f0a;filter:none}
.punch .unit{color:#140f0a}
.punch .sub{color:rgba(20,15,10,.74)}
.punch .chip{background:rgba(20,15,10,.09);border-color:rgba(20,15,10,.22);color:#140f0a}
.logo{height:150px}
.where{font-weight:700;font-size:52px;color:rgba(255,255,255,.66);margin-top:20px}
.prog{position:absolute;top:150px;left:70px;right:70px;height:9px;background:rgba(255,255,255,.14);border-radius:5px}
.prog i{display:block;height:100%;background:#fdc108;border-radius:5px}
.mark{position:absolute;top:186px;left:0;right:0;text-align:center;font-weight:700;font-size:34px;color:rgba(255,255,255,.46)}
</style></head><body>
<div id="stage">
  <div class="bg"></div><div class="grain" id="grain"></div>
  <div id="sparks"></div>
  <div id="scenes"></div>
  <div class="vig"></div>
  <div class="flash" id="flash"></div>
  <div class="prog"><i id="pg"></i></div>
  <div class="mark">루멘수학 · 부천 옥길동</div>
</div>
<script src="/*MATHJAX*/"></script>
<script>
const R = /*REEL*/;
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const eOut=t=>1-Math.pow(1-cl(t,0,1),3);
const eIn =t=>Math.pow(cl(t,0,1),3);
const eBack=t=>{t=cl(t,0,1);const c=2.2;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const lerp=(a,b,t)=>a+(b-a)*cl(t,0,1);
let acc=0; R.scenes.forEach(s=>{s._a=acc; s._b=acc+s.sec; acc+=s.sec}); R.total=acc;

let seed=20261029; const rnd=()=>(seed=(seed*1103515245+12345)&0x7fffffff)/0x7fffffff;
const SP=[...Array(22)].map(()=>({x:rnd()*1080,y:rnd()*1920,d:rnd()*6+3,p:rnd()*6.28,s:rnd()*.9+.6}));
const sparkEl=SP.map(s=>{const e=document.createElement('div');e.className='spark';
  e.style.width=e.style.height=(5+s.s*8)+'px';document.getElementById('sparks').appendChild(e);return e});

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function numBlock(s,size){return `<div class="row"><div class="big"${size?` style="font-size:${size}px"`:''} data-num>0</div>`+
  (s.unit?`<div class="unit">${esc(s.unit)}</div>`:'')+`</div>`}
function html(s){
  if(s.type==='hook') return `<div class="kick">${esc(s.kicker)}</div>${numBlock(s)}
    <div class="sub">${esc(s.sub||'').replace(/\n/g,'<br>')}</div>
    <div class="badge">${esc(s.badge||'')}</div>`;
  if(s.type==='punch') return `<div class="kick">${esc(s.kicker||'')}</div>${numBlock(s,s.size||430)}
    <div class="sub">${esc(s.sub||'').replace(/\n/g,'<br>')}</div>`;
  if(s.type==='lines') return s.lines.map((l,i)=>
    `<div class="line${l.length>13?' sm':''}" data-i="${i}" style="margin-top:${i?40:0}px">${l.replace(/\*(.+?)\*/g,'<span class="hl">$1<u style="width:0"></u></span>')}</div>`).join('');
  if(s.type==='count') return `<div class="kick">${esc(s.kicker||'')}</div>${numBlock(s)}
    <div class="sub">${esc(s.sub||'')}</div>
    ${(s.items||[]).map((x,i)=>`<div class="chip" data-i="${i}">${esc(x)}</div>`).join('')}`;
  if(s.type==='formula') return `<div class="kick">${esc(s.kicker||'')}</div>
    <div class="fxglow"></div><div class="fx" data-fx>${s._svg||''}</div>
    <div class="cap">${esc(s.cap||'').replace(/\n/g,'<br>')}</div>`;
  if(s.type==='close') return `<div class="row"><div class="big" style="font-size:250px">${esc(s.from)}</div>
      <div class="unit" style="opacity:.45;margin:0 32px">→</div>
      <div class="big" style="font-size:250px">${esc(s.to)}</div></div>
    <div class="line sm" style="margin-top:56px">${esc(s.line||'').replace(/\n/g,'<br>')}</div>
    <img class="logo" style="margin-top:72px" src="/*LOGO*/">
    <div class="where">${esc(s.where||'부천 옥길동')}</div>`;
  return '';
}
const host=document.getElementById('scenes');
R.scenes.forEach((s,i)=>{const d=document.createElement('div');
  d.className='scene'+(s.type==='punch'?' punch':'');d.dataset.s=i;d.innerHTML=html(s);host.appendChild(d)});
const nodes=[...host.children];
const flash=document.getElementById('flash');

function render(T){
  document.getElementById('pg').style.width=(T/R.total*100)+'%';
  document.getElementById('grain').style.transform=`translate(${(T*37)%60-30}px,${(T*23)%60-30}px)`;
  sparkEl.forEach((e,i)=>{const s=SP[i];const y=(s.y-T*s.d*9)%2060;
    e.style.transform=`translate(${s.x}px,${(y+2060)%2060-70}px)`;
    e.style.opacity=(.16+.30*(0.5+0.5*Math.sin(T*1.6+s.p))).toFixed(3)});

  let fl=0;
  R.scenes.forEach((s,i)=>{
    const el=nodes[i], t=T-s._a;
    if(t<-.4||t>s.sec+.4){el.style.opacity=0;el.style.visibility='hidden';return}
    el.style.visibility='visible';
    const inA=eOut(t/.40), outA=1-eIn((t-(s.sec-.38))/.38);
    el.style.opacity=cl(Math.min(inA,outA),0,1).toFixed(3);
    // 들어올 때 살짝 크게 → 제자리 (임팩트)
    const sc=lerp(1.06,1,eOut(t/.55)) - lerp(0,.04,eIn((t-(s.sec-.38))/.38));
    el.style.transform=`scale(${sc})`;

    const num=el.querySelector('[data-num]');
    if(num){ const d=s.delay||.4, dur=s.dur||1.1, from=s.from0!==undefined?s.from0:0;
      const k=eOut((t-d)/dur), v=Math.round(lerp(from,s.num,k));
      num.textContent = t<d ? from : v;
      // 숫자가 다 오르는 순간 한 번 쿵
      const land=(t-(d+dur)); if(land>=0&&land<.30){ const b=1+.10*(1-eOut(land/.30));
        num.style.transform=`scale(${b})`; if(land<.12) fl=Math.max(fl,.16*(1-land/.12)); }
      else num.style.transform='scale(1)';
    }
    if(s.type==='hook'||s.type==='punch'){
      const sb=el.querySelector('.sub'); if(sb) sb.style.opacity=cl(eOut((t-.3)/.45),0,1);
      const b=el.querySelector('.badge');
      if(b){const bt=(t-((s.delay||.4)+(s.dur||1.1)+.10))/.45;
        b.style.opacity=cl(eOut(bt),0,1); b.style.transform=`scale(${lerp(.5,1,eBack(bt))})`}
    }
    if(s.type==='lines'){
      el.querySelectorAll('.line').forEach((L,j)=>{const k=eOut((t-(.18+j*.70))/.42);
        L.style.opacity=cl(k,0,1); L.style.transform=`translateY(${lerp(34,0,k)}px) scale(${lerp(1.08,1,k)})`;
        const u=L.querySelector('.hl u'); if(u) u.style.width=(cl(eOut((t-(.18+j*.70)-.30)/.45),0,1)*100)+'%'});
    }
    if(s.type==='count'){
      el.querySelectorAll('.chip').forEach((L,j)=>{const k=eOut((t-(1.45+j*.42))/.40);
        L.style.opacity=cl(k,0,1); L.style.transform=`translateY(${lerp(22,0,k)}px) scale(${lerp(.94,1,eBack(k))})`});
      const sb=el.querySelector('.sub'); if(sb) sb.style.opacity=cl(eOut((t-1.15)/.45),0,1);
    }
    if(s.type==='formula'){
      const fx=el.querySelector('[data-fx]');
      if(fx) fx.style.clipPath=`inset(0 ${(1-cl(eOut((t-.38)/1.45),0,1))*100}% 0 0)`;
      const c=el.querySelector('.cap'); if(c) c.style.opacity=cl(eOut((t-1.70)/.55),0,1);
    }
    if(s.type==='close'){
      const lg=el.querySelector('.logo'), k=eOut((t-.70)/.6);
      lg.style.opacity=cl(k,0,1); lg.style.transform=`scale(${lerp(.82,1,eBack(k))})`;
      el.querySelector('.where').style.opacity=cl(eOut((t-1.0)/.5),0,1);
    }
  });
  flash.style.opacity=fl.toFixed(3);
}
window.__render=render; window.__ready=true;
</script></body></html>
