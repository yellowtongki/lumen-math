  <section class="sol" id="q1">
    <div class="sol-head">
      <span class="sol-k">1</span>
      <div>
        <div class="sol-title">\(\int f\,dx=F\)이면 <b>\(f=F^{\prime}\)</b></div>
        <div class="sol-kind"><span class="dbadge">난이도 2 · 4.5점</span> 부정적분 · 부정적분과 미분</div>
      </div>
    </div>
    <div class="sol-body">
      <div class="pstate">\(\displaystyle\int f(x)\,dx=3x^2-x+C\)일 때, \(f(1)\)의 값은?<br>① \(1\) ② \(2\) ③ \(3\) ④ \(4\) ⑤ \(5\)</div>
      <div class="step">
        <span class="step-lab"><span class="dot"></span>풀이</span>
        <p>양변을 미분하면 \(f(x)=6x-1\).</p>
      </div>
      <div class="result"><span class="lab">정답</span><span class="val">\(f(1)=5\ \Rightarrow\) ⑤</span></div>
      <div class="miss"><b>가장 잦은 실수</b> \(3x^2-x\)에 그대로 \(1\)을 넣어 \(2\)(②)를 고르는 것. 그것은 \(f\)가 아니라 <b>부정적분</b>의 값이다.</div>
    </div>
  </section>
