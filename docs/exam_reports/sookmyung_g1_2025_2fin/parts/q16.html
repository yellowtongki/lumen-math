  <section class="sol" id="q16">
    <div class="sol-head">
      <span class="sol-k">16</span>
      <div>
        <div class="sol-title">\(f^{-1}(5)=k\) ⇔ <b>\(f(k)=5\)</b></div>
        <div class="sol-kind"><span class="dbadge">난이도 1 · 서술형</span> 역함수</div>
      </div>
    </div>
    <div class="sol-body">
      <div class="pstate">함수 \(f(x)=2x+1\)에 대하여 \(f^{-1}(5)\)의 값을 구하시오.</div>
      <div class="step">
        <span class="step-lab"><span class="dot"></span>풀이</span>
        <div class="mathrow">$$2k+1=5\ \Rightarrow\ k=2$$</div>
      </div>
      <div class="result"><span class="lab">정답</span><span class="val">\(2\)</span></div>
      <div class="step">
        <span class="step-lab"><span class="dot"></span>채점 기준 (예시)</span>
        <div class="cond"><div class="row"><span class="lab">1단계</span><span>\(f(k)=5\)로 바꾸기</span></div><div class="row"><span class="lab">2단계</span><span>\(k=2\)</span></div></div>
      </div>
      <div class="miss"><b>가장 잦은 실수</b> \(f(5)=11\)을 계산하는 것.</div>
    </div>
  </section>
