  <section class="sol" id="q1">
    <div class="sol-head">
      <span class="sol-k">1</span>
      <div>
        <div class="sol-title">합성은 <b>안쪽부터</b></div>
        <div class="sol-kind"><span class="dbadge">난이도 1</span> 합성함수</div>
      </div>
    </div>
    <div class="sol-body">
      <div class="pstate">두 함수 \(f(x)=3x-5\), \(g(x)=x-2\)에 대하여 \((f\circ g)(3)\)의 값은?<br>① \(-2\) ② \(-1\) ③ \(0\) ④ \(1\) ⑤ \(2\)</div>
      <div class="step">
        <span class="step-lab"><span class="dot"></span>풀이</span>
        <div class="mathrow">$$(f\circ g)(3)=f(g(3))=f(1)=-2$$</div>
      </div>
      <div class="result"><span class="lab">정답</span><span class="val">\(-2\ \Rightarrow\) ①</span></div>
      <div class="miss"><b>가장 잦은 실수</b> \(g(f(3))=2\)를 계산하는 것. \(f\circ g\)는 \(g\)를 먼저 한다.</div>
    </div>
  </section>
