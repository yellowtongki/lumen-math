  <section class="sol" id="q2">
    <div class="sol-head">
      <span class="sol-k">2</span>
      <div>
        <div class="sol-title">합성함수 값 — <b>오른쪽부터</b></div>
        <div class="sol-kind"><span class="dbadge">난이도 2 · 4.3점</span> 합성함수 · 함숫값</div>
      </div>
    </div>
    <div class="sol-body">
      <div class="pstate">두 함수 \(f(x)=x^2-2x\), \(g(x)=x+1\)에 대하여 \((g\circ f)(2)\)의 값은?<br>① \(1\) ② \(2\) ③ \(3\) ④ \(4\) ⑤ \(5\)</div>
      <div class="step">
        <span class="step-lab"><span class="dot"></span>풀이</span>
        <p>\(f(2)=4-4=0\), \(g(0)=1\).</p>
      </div>
      <div class="result"><span class="lab">정답</span><span class="val">\(1\ \Rightarrow\) ①</span></div>
      <div class="miss"><b>가장 잦은 실수</b> \(f(g(2))=f(3)=3\)으로 순서를 바꿔 ③을 고르는 것. \((g\circ f)(x)=g(f(x))\) — <b>\(f\)가 먼저</b>.</div>
    </div>
  </section>
