  <section class="sol" id="q2">
    <div class="sol-head">
      <span class="sol-k">2</span>
      <div>
        <div class="sol-title">\(A-B\) = \(A\)에는 있고 <b>\(B\)에는 없는</b> 원소</div>
        <div class="sol-kind"><span class="dbadge">난이도 2 · 3.4점</span> 집합의 연산 · 차집합</div>
      </div>
    </div>
    <div class="sol-body">
      <div class="pstate">두 집합 \(A=\{1,\ 2,\ 3,\ 4\}\), \(B=\{1,\ 3,\ 5\}\)에 대하여 \(A-B\)의 원소의 합은?<br>① \(4\) ② \(5\) ③ \(6\) ④ \(7\) ⑤ \(8\)</div>
      <div class="step">
        <span class="step-lab"><span class="dot"></span>풀이</span>
        <p>\(A-B=\{2,\ 4\}\)</p>
      </div>
      <div class="result"><span class="lab">정답</span><span class="val">\(2+4=6\ \Rightarrow\) ③</span></div>
      <div class="miss"><b>가장 잦은 실수</b> \(B-A=\{5\}\)와 바꿔 읽는 것. 빼기 앞에 있는 집합 \(A\)에서 출발한다.</div>
    </div>
  </section>
