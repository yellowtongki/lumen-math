  <section class="sol" id="q1">
    <div class="sol-head">
      <span class="sol-k">1</span>
      <div>
        <div class="sol-title">다항함수의 극한은 <b>그냥 대입</b></div>
        <div class="sol-kind"><span class="dbadge">난이도 2 · 3.3점</span> 함수의 극한 · 극한값 계산</div>
      </div>
    </div>
    <div class="sol-body">
      <div class="pstate">\(\displaystyle\lim_{x\to1}(2x+1)\)의 값은?<br>① \(1\) ② \(2\) ③ \(3\) ④ \(4\) ⑤ \(5\)</div>
      <div class="step">
        <span class="step-lab"><span class="dot"></span>풀이</span>
        <div class="mathrow">$$\lim_{x\to1}(2x+1)=2\cdot1+1=3$$</div>
      </div>
      <div class="result"><span class="lab">정답</span><span class="val">\(3\ \Rightarrow\) ③</span></div>
      <div class="miss"><b>가장 잦은 실수</b> 「극한은 그 값에 가까워질 뿐」이라며 대입을 망설이는 것. 다항함수는 어디서나 연속이라 <b>대입한 값이 곧 극한값</b>이다.</div>
    </div>
  </section>
