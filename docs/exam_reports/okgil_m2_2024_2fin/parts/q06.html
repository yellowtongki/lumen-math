    <div class="sol-head">
      <span class="sol-k">6</span>
      <div>
        <div class="sol-title">동시에 일어남 → 확률의 <b>곱</b></div>
        <div class="sol-kind"><span class="dbadge">난이도 3 · 3점</span> 확률의 곱셈</div>
      </div>
    </div>
    <div class="sol-body">
      <div class="pstate">서로 다른 동전 두 개와 주사위 한 개를 동시에 던질 때, 동전은 다른 면이 나오고 주사위는 홀수가 나올 확률은?<br>① \(\dfrac13\) ② \(\dfrac1{12}\) ③ \(\dfrac18\) ④ \(\dfrac14\) ⑤ \(\dfrac12\)</div>
      <div class="step">
        <span class="step-lab"><span class="dot"></span>풀이</span>
        <div class="mathrow">$$\frac24\times\frac36=\frac14$$</div>
      </div>
      <div class="result"><span class="lab">정답</span><span class="val">④</span></div>
      <div class="miss"><b>가장 잦은 실수</b> 동전이 다른 면일 확률을 \(\frac14\)로 두는 것 — (앞, 뒤)와 (뒤, 앞) 두 가지.</div>
    </div>
  </section>
