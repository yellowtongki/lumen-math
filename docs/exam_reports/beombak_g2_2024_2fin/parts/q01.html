  <section class="sol" id="q1">
    <div class="sol-head">
      <span class="sol-k">1</span>
      <div>
        <div class="sol-title">도함수 → 적분 → <b>\(f(0)\)으로 상수</b></div>
        <div class="sol-kind"><span class="dbadge">난이도 2 · 3.5점</span> 부정적분 · 도함수에서 원래 함수</div>
      </div>
    </div>
    <div class="sol-body">
      <div class="pstate">함수 \(y=f(x)\)에 대하여 \(f'(x)=4x-5\)이고 \(f(0)=2\)일 때, \(f(3)\)의 값은?<br>① \(2\) ② \(3\) ③ \(4\) ④ \(5\) ⑤ \(6\)</div>
      <div class="step">
        <span class="step-lab"><span class="dot"></span>풀이</span>
        <p>\(f=2x^2-5x+2\), \(f(3)=18-15+2=5\).</p>
      </div>
      <div class="result"><span class="lab">정답</span><span class="val">\(5\ \Rightarrow\) ④</span></div>
      <div class="miss"><b>가장 잦은 실수</b> \(+C\)를 잊어 \(3\)(②)을 고르는 것.</div>
    </div>
  </section>
