  <section class="sol" id="q4">
    <div class="sol-head">
      <span class="sol-k">4</span>
      <div>
        <div class="sol-title">정적분 기본 계산</div>
        <div class="sol-kind"><span class="dbadge">난이도 3 · 3.5점</span> 정적분 · 계산</div>
      </div>
    </div>
    <div class="sol-body">
      <div class="pstate">\(\displaystyle\int_{-1}^{2}(3x^2-4x+1)\,dx\)의 값은?<br>① \(4\) ② \(5\) ③ \(6\) ④ \(7\) ⑤ \(8\)</div>
      <div class="step">
        <span class="step-lab"><span class="dot"></span>풀이</span>
        <div class="mathrow">$$\big[x^3-2x^2+x\big]_{-1}^{2}=2-(-4)=6$$</div>
      </div>
      <div class="result"><span class="lab">정답</span><span class="val">\(6\ \Rightarrow\) ③</span></div>
      <div class="miss"><b>가장 잦은 실수</b> 아래끝 \(-1\)을 넣을 때 \((-1)^3=-1\), \(-2(-1)^2=-2\), \(+(-1)\)의 부호 실수가 가장 잦다.</div>
    </div>
  </section>
