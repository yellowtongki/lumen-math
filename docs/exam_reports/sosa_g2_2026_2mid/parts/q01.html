  <section class="sol" id="q1">
    <div class="sol-head">
      <span class="sol-k">1</span>
      <div>
        <div class="sol-title">연속인 함수의 극한 = <b>대입</b></div>
        <div class="sol-kind"><span class="dbadge">난이도 2 · 3.4점</span> 함수의 극한</div>
      </div>
    </div>
    <div class="sol-body">
      <div class="pstate">\(\displaystyle\lim_{x\to8}\sqrt{x+1}\)의 값은?<br>① \(1\) ② \(2\) ③ \(3\) ④ \(4\) ⑤ \(5\)</div>
      <div class="step">
        <span class="step-lab"><span class="dot"></span>풀이</span>
        <div class="mathrow">$$\lim_{x\to8}\sqrt{x+1}=\sqrt9=3$$</div>
      </div>
      <div class="result"><span class="lab">정답</span><span class="val">③</span></div>
      <div class="miss"><b>가장 잦은 실수</b> \(\sqrt8+1\)처럼 근호 범위를 잘못 읽는 것.</div>
    </div>
  </section>
