  <section class="sol" id="q2">
    <div class="sol-head">
      <span class="sol-k">2</span>
      <div>
        <div class="sol-title">평균변화율 = <b>두 점을 잇는 기울기</b></div>
        <div class="sol-kind"><span class="dbadge">난이도 2 · 3.4점</span> 미분계수 · 평균변화율</div>
      </div>
    </div>
    <div class="sol-body">
      <div class="pstate">함수 \(f(x)=x^2-2x\)에서 \(x\)의 값이 \(1\)에서 \(3\)까지 변할 때의 평균변화율은?<br>① \(1\) ② \(\dfrac32\) ③ \(2\) ④ \(\dfrac52\) ⑤ \(3\)</div>
      <div class="step">
        <span class="step-lab"><span class="dot"></span>풀이</span>
        <div class="mathrow">$$\frac{f(3)-f(1)}{3-1}=\frac{3-(-1)}{2}=2$$</div>
      </div>
      <div class="result"><span class="lab">정답</span><span class="val">③</span></div>
      <div class="miss"><b>가장 잦은 실수</b> \(f(3)-f(1)=4\)에서 \(2\)로 나누는 것을 잊는 것.</div>
    </div>
  </section>
