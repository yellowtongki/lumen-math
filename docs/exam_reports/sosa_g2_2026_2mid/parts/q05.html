  <section class="sol" id="q5">
    <div class="sol-head">
      <span class="sol-k">5</span>
      <div>
        <div class="sol-title">접선의 기울기 = <b>\(f^{\prime}(1)\)</b></div>
        <div class="sol-kind"><span class="dbadge">난이도 3 · 3.8점</span> 미분 · 접선의 기울기</div>
      </div>
    </div>
    <div class="sol-body">
      <div class="pstate">함수 \(f(x)=x^3-3x^2+2x+1\) 위의 점 \((1,\ 1)\)에서의 접선의 기울기는?<br>① \(-2\) ② \(-1\) ③ \(0\) ④ \(1\) ⑤ \(2\)</div>
      <div class="step">
        <span class="step-lab"><span class="dot"></span>풀이</span>
        <div class="mathrow">$$f^{\prime}(x)=3x^2-6x+2,\quad f^{\prime}(1)=-1$$</div>
      </div>
      <div class="result"><span class="lab">정답</span><span class="val">②</span></div>
      <div class="miss"><b>가장 잦은 실수</b> 함숫값 \(f(1)=1\)(④)을 기울기로 쓰는 것.</div>
    </div>
  </section>
