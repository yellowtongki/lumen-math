<html><head><meta charset="utf-8"><style>
body{margin:0;background:#eef2f8;font-family:"Noto Sans KR",sans-serif;width:390px}
.top{background:#0d2240;color:#fff;padding:14px 16px;font-weight:900;font-size:16px}
.wrap{padding:14px;display:flex;flex-direction:column;gap:12px}
.big{border-radius:22px;padding:18px 16px 14px;color:#fff;background:linear-gradient(160deg,#ffb020,#ff7a00 60%,#f05a00);position:relative;overflow:hidden;box-shadow:0 8px 20px rgba(255,122,0,.3)}
.big .fl{position:absolute;right:-4px;top:-6px;font-size:96px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.15))}
.big .lb{font-size:13px;font-weight:900;opacity:.95}
.big .n{font-size:64px;font-weight:900;line-height:1;letter-spacing:-2px;margin-top:6px}
.big .u{font-size:18px;font-weight:900;margin-left:4px;letter-spacing:0}
.big .msg{font-size:13px;font-weight:800;margin-top:6px}
.wk{display:flex;gap:4px;margin-top:12px;background:rgba(255,255,255,.18);border-radius:14px;padding:8px 6px}
.wk span{flex:1;text-align:center;font-size:11px;font-weight:900}
.wk i{display:block;margin:4px auto 0;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.3);font-style:normal;line-height:24px;font-size:13px;color:#ff7a00}
.wk i.y{background:#fff}.wk i.t{outline:2.5px solid #fff;outline-offset:2px;background:transparent;color:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sm{border-radius:18px;padding:13px;background:#fff;border:1px solid #e6eaf1}
.sm .t{font-size:12px;font-weight:900;color:#64748b}.sm .v{font-size:30px;font-weight:900;color:#ff6a00;line-height:1.1;margin-top:4px}.sm .v small{font-size:13px;color:#ff8a3d}
.sm .s{font-size:11px;font-weight:800;color:#94a3b8;margin-top:3px}
.ms{display:flex;gap:6px;margin-top:8px}
.ms b{flex:1;text-align:center;border-radius:10px;padding:6px 0;font-size:11px;font-weight:900;background:#f1f5f9;color:#94a3b8}
.ms b.on{background:#fff7ed;color:#ea580c;border:1.5px solid #fdba74}
.note{font-size:11px;color:#64748b;font-weight:700;line-height:1.6;background:#fff;border-radius:14px;padding:10px 12px;border:1px dashed #cbd5e1}
</style></head><body>
<div class="top">학생앱 홈 (미리보기)</div>
<div class="wrap">
 <div class="big"><div class="fl">🔥</div><div class="lb">📒 플래너 연속 제출</div>
  <div class="n">12<span class="u">일 연속!</span></div><div class="msg">오늘 내면 13일 — 불꽃을 이어 가요!</div>
  <div class="wk"><span>월<i class="t">·</i></span><span>화<i></i></span><span>수<i></i></span><span>목<i></i></span><span>금<i></i></span><span>토<i></i></span><span>일<i></i></span></div></div>
 <div class="row">
  <div class="sm"><div class="t">🎙 녹음 연속</div><div class="v">13<small>회</small></div><div class="s">수업일마다 · 최고 13회</div></div>
  <div class="sm"><div class="t">🏆 최고 기록</div><div class="v">12<small>일</small></div><div class="s">플래너 · 지금이 최고!</div></div>
 </div>
 <div class="sm"><div class="t">🎖 연속 메달</div>
  <div class="ms"><b class="on">7일</b><b>14일</b><b>30일</b><b>50일</b><b>100일</b></div>
  <div class="s">7일마다 메달 · 끊기면 🧊 다시 1일부터</div></div>
 <div class="note">학원앱(선생님)에는 학생 달력 위에 같은 숫자가 작은 카드로 · 학부모앱에도 «12일 연속»을 보여 줄 수 있어요.</div>
</div></body></html>
